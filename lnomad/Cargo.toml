[package]
name = "lnomad"
# Versioned independently of the leviculum stack — see the note in
# lblogd/Cargo.toml. A browser's releases track its own UI and rendering
# work, not the protocol core it happens to be built from.
version = "0.1.2"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Terminal browser and ANSI renderer for NomadNet micron pages"

[lints.rust]
unsafe_code = "forbid"

# `cargo deb -p lnomad --target x86_64-unknown-linux-musl` builds a
# musl-static .deb. Deliberately a separate package from `leviculum`:
# that package auto-enables and starts the lnsd systemd service, which
# a browser-only user must not get pulled in.
[package.metadata.deb]
name = "lnomad"
maintainer = "Lew Palm <lp@lew-palm.de>"
copyright = "2025, Lew Palm"
license-file = ["../LICENSE", "0"]
extended-description = """\
Nomadnet terminal browser for the Reticulum network. Connects to a
local shared RNS instance — leviculum's lnsd or the Python rnsd —
fetches micron pages, and renders them in the terminal.
"""
section = "net"
priority = "optional"
# The binary is musl-static, so cargo-deb's `$auto` would find no
# shared-library deps and only emit a warning. There is no hard runtime
# dependency either: any RNS instance satisfies the need, so leviculum
# is a Recommends, not a Depends.
#
# `depends` is left unset on purpose. cargo-deb emits `Depends:` with an
# empty value either way — Debian wants the field omitted entirely when
# there are no dependencies — so scripts/deb-finalize.sh strips it back
# out after the build.
recommends = "leviculum"
assets = [
    # cargo-deb only recognises "target/release/..." exactly as a Cargo
    # target path and auto-substitutes the --target triple into it. Any
    # prefix disables the rewrite and silently picks up stale non-musl
    # builds — see leviculum-cli/Cargo.toml.
    ["target/release/lnomad", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/lnomad/README.md", "644"],
    # Rendered from docs/src/man/ by scripts/md2man.py; see lblogd's
    # manifest for why the Markdown under docs/ is the single source.
    ["../target/man/lnomad.1", "usr/share/man/man1/lnomad.1", "644"],
    # Documented overrides for the two lintian tags that a
    # musl-static binary always trips; the file explains why each
    # is a deliberate deviation rather than a defect.
    ["../packaging/lintian/lnomad", "usr/share/lintian/overrides/lnomad", "644"],
    # Codeberg #288; see leviculum-cli/Cargo.toml for what this file is and
    # why a musl-static package needs it.
    ["../THIRD-PARTY-NOTICES", "usr/share/doc/lnomad/THIRD-PARTY-NOTICES", "644"],
]
changelog = "../target/deb-changelog/lnomad"

[features]
# leviculum-std's interface families, forwarded and on by default (#463);
# see lnpnd's manifest for why they are forwarded and not inherited.
default = ["ble", "serial", "tui"]
ble = ["leviculum-std/ble"]
serial = ["leviculum-std/serial"]
# The terminal frontend: the `tui` module, the terminal half of `image`, and
# the binary. Off, the crate is the browser core and its pure helpers with no
# terminal crate in the graph, which is what `just lnomad-core-no-tui` builds
# (Codeberg #219: a second frontend is a swap, not a rework).
tui = [
    "dep:leviculum-ui-ratatui",
    "dep:ratatui",
    "dep:crossterm",
    "dep:terminal_size",
]
# `lnomad --gui`: the window (`gui`, slice 2 of
# docs/src/concepts/lnomad-everywhere.md), on the window widgets shared with
# Loquax. Off by default, so iced is in no graph that does not ask for it:
# not the terminal package's, not the core's. Built for the gnu target, as
# Loquax's window: winit opens X11 and Wayland with dlopen, which a
# musl-static binary cannot do.
gui = ["dep:iced", "dep:leviculum-ui-iced"]

[dependencies]
leviculum-micron = { path = "../leviculum-micron" }
leviculum-ui = { path = "../leviculum-ui" }
# The shared terminal widgets and shell, the frontend half (`tui`).
leviculum-ui-ratatui = { path = "../leviculum-ui-ratatui", features = ["images"], optional = true }
# The window's widgets (`gui`), shared with Loquax's window.
leviculum-ui-iced = { path = "../leviculum-ui-iced", optional = true }
# The window (`gui`): iced 0.14 as Loquax's window has it, the software
# renderer alone; `advanced` for loading the page's face into the font
# system a view drawn without a window uses; Fira Sans embedded for the
# chrome, so a picture and its golden agree on every host.
iced = { version = "0.14", default-features = false, features = [
    "tiny-skia",
    "x11",
    "wayland",
    "thread-pool",
    "advanced",
    "fira-sans",
], optional = true }
# Default features off, see `[features]`.
leviculum-std = { path = "../leviculum-std", default-features = false, features = ["compression"] }
leviculum-core = { path = "../leviculum-core" }
rmpv.workspace = true
thiserror.workspace = true
tokio.workspace = true
serde.workspace = true
# The scene's golden files (`app::scene`).
serde_json = "1"
toml.workspace = true
clap = { version = "4", features = ["derive"] }
terminal_size = { version = "0.4", optional = true }
ratatui = { version = "0.30.2", optional = true }
crossterm = { version = "0.29.0", features = ["event-stream"], optional = true }
unicode-width = "0.2.2"
futures = "0.3.32"
# Default features off: the core keeps an `Input` per text field, and the
# default `ratatui-crossterm` feature would pull both terminal crates into it.
# The key-to-edit table that feature carries is restated in
# `leviculum_ui::input`.
tui-input = { version = "0.15", default-features = false }
open = "5"
# Decoding only. `image`'s default feature set pulls in every codec it knows;
# these three are what a blog post actually carries, and each extra decoder is
# attack surface for bytes handed to us by a stranger's node.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }

[dev-dependencies]
tempfile = "3"
hex = "0.4"
# The window's PNG goldens (`gui`); in the lock already, through Loquax's.
png = "0.18"

[lib]
name = "lnomad"
path = "src/lib.rs"

[[bin]]
name = "lnomad"
path = "src/main.rs"
required-features = ["tui"]
