\* Run as
\*   java -cp tla2tools.jar tlc2.TLC -config ChannelHold.cfg MCChannelHold.tla
\* once per (PeerSpeaks, AckComes) pair (all four hold; dropping the stale
\* bound from Alive breaks HeldBounded, as it should).
CONSTANTS
    Max = 5
    Ord <- OrdV
    Cap = 3
    Bound = 20
    PeerSpeaks = TRUE
    AckComes = FALSE
SPECIFICATION Spec
INVARIANTS HeldBounded SilentAsToday TornOnlyWhenDead
PROPERTIES EventuallyDone
CHECK_DEADLOCK FALSE
