\* No loss, a cold ladder (13) inside the bound (30). Run as
\*   java -cp tla2tools.jar tlc2.TLC -config ChannelHold.cfg MCChannelHold.tla
\* once per (PeerSpeaks, PeerElsewhere, PeerProves, AckComes), all sixteen.
CONSTANTS
    Max = 5
    Ord <- OrdV
    Share <- ShareV
    Cap = 3
    Bound = 30
    MaxScale = 4
    PeerSpeaks = TRUE
    PeerElsewhere = FALSE
    PeerProves = FALSE
    ProofGap = 1
    ReceiptsPerAttempt = TRUE
    MaxLosses = 0
    AckComes = FALSE
SPECIFICATION Spec
INVARIANTS HeldBounded SilentAsToday SilentByBound NoInboundNoLearning TornOnlyWhenDead DeliveredNeverTorn HeldWhileProving LearnedDecays
PROPERTIES EventuallyDone
CHECK_DEADLOCK FALSE
