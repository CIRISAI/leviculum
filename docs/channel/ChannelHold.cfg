\* Run as
\*   java -cp tla2tools.jar tlc2.TLC -config ChannelHold.cfg MCChannelHold.tla
\* once per (PeerSpeaks, PeerElsewhere, AckComes) triple (all eight hold; dropping the stale
\* bound from Alive breaks HeldBounded, as it should; waits without their
\* Share cap (OrdWait = s * Ord[k]) break HeldBounded at MaxScale 4, as the
\* code did before review 6 finding 3; evidence on the clock (PeerEvidence
\* without its PeerElsewhere guard) breaks SilentAsToday, as it should;
\* ReceiptsPerAttempt = FALSE breaks DeliveredNeverTorn (the coupling); the
\* learned waits without evidence (Due on scale always) break SilentAsToday).
CONSTANTS
    Max = 5
    Ord <- OrdV
    Share <- ShareV
    Cap = 3
    Bound = 30
    MaxScale = 4
    PeerSpeaks = TRUE
    PeerElsewhere = FALSE
    ReceiptsPerAttempt = TRUE
    AckComes = FALSE
SPECIFICATION Spec
INVARIANTS HeldBounded SilentAsToday SilentByBound NoInboundNoLearning TornOnlyWhenDead DeliveredNeverTorn
PROPERTIES EventuallyDone
CHECK_DEADLOCK FALSE
