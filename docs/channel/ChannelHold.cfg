\* Run as
\*   java -cp tla2tools.jar tlc2.TLC -config ChannelHold.cfg MCChannelHold.tla
\* once per (PeerSpeaks, AckComes) pair (all four hold; dropping the stale
\* bound from Alive breaks HeldBounded, as it should; MaxScale = 3 is past
\* the cap and is refused by the ASSUME; with that ASSUME removed it breaks
\* SilentByBound, as it should).
CONSTANTS
    Max = 5
    Ord <- OrdV
    Cap = 3
    Bound = 30
    MaxScale = 2
    PeerSpeaks = TRUE
    AckComes = FALSE
SPECIFICATION Spec
INVARIANTS HeldBounded SilentAsToday SilentByBound NoInboundNoLearning TornOnlyWhenDead
PROPERTIES EventuallyDone
CHECK_DEADLOCK FALSE
