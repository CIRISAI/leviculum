\* One transmission may be lost. Safety only: the temporal check ran TLC out
\* of memory with Lose in the state (EventuallyDone: ChannelHold.cfg). Run as
\*   java -cp tla2tools.jar tlc2.TLC -config ChannelHoldLoss.cfg MCChannelHold.tla
\* once per (PeerSpeaks, PeerElsewhere, PeerProves, AckComes), all sixteen.
CONSTANTS
    Max = 5
    Ord <- OrdV
    Share <- ShareV
    Cap = 3
    Bound = 30
    MaxScale = 4
    PeerSpeaks = TRUE
    PeerElsewhere = FALSE
    PeerProves = FALSE
    ProofGap = 1
    ReceiptsPerAttempt = TRUE
    MaxLosses = 1
    AckComes = FALSE
SPECIFICATION Spec
INVARIANTS HeldBounded SilentAsToday SilentByBound HeldWhileProving DeliveredNeverTorn ResentWithinHeldWait
CHECK_DEADLOCK FALSE
