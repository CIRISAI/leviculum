\* The loss variant of ChannelHold.cfg: one transmission may be lost (Lose),
\* safety only: TLC's liveness check runs out of memory with Lose in the
\* state, so EventuallyDone is checked loss-free by ChannelHold.cfg. Run as
\*   java -cp tla2tools.jar tlc2.TLC -config ChannelHoldLoss.cfg MCChannelHold.tla
\* once per (PeerSpeaks, PeerElsewhere, PeerProves, AckComes), all sixteen,
\* and the same sixteen with ChannelHoldCold.cfg (a cold ladder longer than
\* the bound: nothing ASSUMEd between Share and Ord). All hold. Mutations,
\* each breaking what it should: the bound dropped from Alive (HeldBounded);
\* the waits without their Share cap, peer speaking (HeldBounded); evidence
\* on the clock, PeerEvidence without its guard (SilentAsToday);
\* ReceiptsPerAttempt = FALSE (DeliveredNeverTorn, HeldWhileProving); the
\* learned waits without evidence (SilentAsToday); no decay (LearnedDecays);
\* no resend while held (ResentWithinHeldWait).
CONSTANTS
    Max = 5
    Ord <- OrdV
    Share <- ShareV
    Cap = 3
    Bound = 30
    MaxScale = 4
    PeerSpeaks = TRUE
    PeerElsewhere = FALSE
    PeerProves = FALSE
    ProofGap = 1
    ReceiptsPerAttempt = TRUE
    MaxLosses = 1
    AckComes = FALSE
SPECIFICATION Spec
INVARIANTS HeldBounded SilentAsToday NoInboundNoLearning TornOnlyWhenDead DeliveredNeverTorn HeldWhileProving LearnedDecays ResentWithinHeldWait

CHECK_DEADLOCK FALSE
