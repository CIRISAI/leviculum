\* Run as
\*   java -cp tla2tools.jar tlc2.TLC -config HeadOfLine.cfg MCHeadOfLine.tla
\* once per (Rtt, QA, Death) in {2, 6} x {3, 9} x {1, 5, 100}: a queue
\* shorter or longer than the cold ladder, A overdue early or late, the
\* peer dying before B's send, mid-queue, or not at all. All hold.
\* Mutations: B's own rule always (no head-of-line: QueuedNotTorn breaks);
\* head-of-line without the overdue clause (DeadFound breaks: a peer that
\* died mid-queue is found only at the bound).
CONSTANTS
    Max = 3
    Ord <- OrdV
    Cap = 2
    Bound = 20
    BSend = 2
    Rtt = 2
    QA = 3
    QB = 3
    Death = 100
SPECIFICATION Spec
INVARIANTS QueuedNotTorn NeverPastBound DeadFound
PROPERTIES EventuallyDone
CHECK_DEADLOCK FALSE
