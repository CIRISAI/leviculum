\* A cold ladder (26) LONGER than the bound (10): an uncapped first-try
\* SRTT. By then the bound has passed, so the hold is never entered: only
\* what does not need it is listed. Run as
\*   java -cp tla2tools.jar tlc2.TLC -config ChannelHoldCold.cfg MCChannelHold.tla
\* once per (PeerSpeaks, PeerElsewhere, PeerProves, AckComes), all sixteen.
CONSTANTS
    Max = 5
    Ord <- OrdColdV
    Share <- ShareColdV
    Cap = 3
    Bound = 10
    MaxScale = 4
    PeerSpeaks = TRUE
    PeerElsewhere = FALSE
    PeerProves = FALSE
    ProofGap = 3
    ReceiptsPerAttempt = TRUE
    MaxLosses = 0
    AckComes = FALSE
SPECIFICATION Spec
INVARIANTS HeldBounded SilentAsToday DeliveredNeverTorn
PROPERTIES EventuallyDone
CHECK_DEADLOCK FALSE
