[package]
name = "leviculum-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core library for reticulum - no_std compatible"

# `--cfg fuzzing` is set by cargo-fuzz for the detached `fuzz/` harness; declare
# it so the unexpected-cfgs lint stays quiet in normal (non-fuzz) builds.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[features]
default = ["tracing"]
# No std feature - leviculum-core is always no_std
compression = ["dep:libbz2-rs-sys"]
# `tracing` is optional so the crate builds on atomic-less MCUs (Cortex-M0 /
# thumbv6m), where tracing-core's CAS-based callsite registry does not compile.
# With the feature off, the level macros become no-ops via the `tracing` shim
# in lib.rs. Build the M0 target with `--no-default-features`.
tracing = ["dep:tracing"]

[dependencies]
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
aes.workspace = true
cbc.workspace = true
sha2.workspace = true
hmac.workspace = true
hkdf.workspace = true
rand_core.workspace = true
tracing = { workspace = true, optional = true }
heapless = { version = "0.8", default-features = false }
libbz2-rs-sys = { workspace = true, optional = true }

# +ciris (leviculum#108): UEFI is a soft-float target, and sha2's SIMD path
# does not compile there. The aes and curve25519-dalek software backends are
# cfgs, set for this target in .cargo/config.toml (a downstream UEFI build
# sets the same two).
[target.'cfg(target_os = "uefi")'.dependencies]
sha2 = { workspace = true, features = ["force-soft"] }

[dev-dependencies]
# proptest: per target, at the end of this file (+ciris leviculum#108).
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
# OsRng is needed for tests (only available with getrandom feature)
rand_core = { version = "0.6", features = ["getrandom"] }
# Capture structured tracing output in mvr tests to prove the exact drop reason.
tracing-subscriber.workspace = true
# Host-side replay of the firmware's real allocator for the #65 fragmentation
# harness. Same crate/version the firmware links (leviculum-nrf). `llff` only:
# the firmware uses LlffHeap. `critical-section/std` supplies the lock impl the
# heap needs on the host (the firmware supplies its own single-core impl).
embedded-alloc = { version = "0.7", default-features = false, features = ["llff"] }
critical-section = { version = "1", features = ["std"] }
# The board's rule for an owed telemetry retransmission (#344), driven by the
# report-drop mvr against real NodeCores instead of mirrored in the test.
# Dev-only and dependency-free: no cycle, and nothing core ships links it.
leviculum-telemetry-policy = { path = "../leviculum-nrf/telemetry-policy" }

# +ciris (leviculum#108): core's tests run on wasm32-wasip1 under wasmtime.
# proptest's default `fork`/`timeout` features spawn processes through
# wait-timeout, which does not build for WASI; the wasm lane takes it
# without them. Resolver 2 keeps the two feature sets apart per target.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest.workspace = true
[target.'cfg(target_family = "wasm")'.dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
