# Nightly build pipeline for leviculum.
#
# Builds two musl-static .deb packages (amd64 + arm64) and uploads
# them to a rolling `nightly` release on Codeberg. Assets are
# overwritten each run, so these download URLs stay stable:
#
#   https://codeberg.org/Lew_Palm/leviculum/releases/download/nightly/leviculum-nightly-amd64.deb
#   https://codeberg.org/Lew_Palm/leviculum/releases/download/nightly/leviculum-nightly-arm64.deb
#
# The lnomad terminal browser ships as its own .deb + tarball (it must
# not pull in the auto-started lnsd service that the leviculum package
# sets up):
#
#   https://codeberg.org/Lew_Palm/leviculum/releases/download/nightly/lnomad-nightly-amd64.deb
#   https://codeberg.org/Lew_Palm/leviculum/releases/download/nightly/lnomad-nightly-arm64.deb
#
# So does the lblogd dev-blog server, which installs a systemd service of
# its own:
#
#   https://codeberg.org/Lew_Palm/leviculum/releases/download/nightly/lblogd-nightly-amd64.deb
#   https://codeberg.org/Lew_Palm/leviculum/releases/download/nightly/lblogd-nightly-arm64.deb
#
# lnomad and lblogd carry their own version numbers, independent of the
# leviculum stack's; scripts/deb-stamp.sh derives one Debian version per
# package.
#
# The lnflash firmware bundle is not a package at all — it is the
# stranger-unpacks-it tarball (one binary, one UF2 per board in
# scripts/lnflash-bundle.sh's BOARDS list, Nordic's S140 SoftDevice and
# its licence), so it ships as a tarball only:
#
#   https://codeberg.org/Lew_Palm/leviculum/releases/download/nightly/lnflash-nightly-amd64.tar.gz
#
# It is also the ONLY published form of the embedded firmware, which makes
# it the reader's path rather than a convenience. Codeberg #295: the README
# advertised two supported boards and offered nothing but a source build,
# while this bundle had carried an image for each of them since 24481f12,
# and the release body went on naming only the T114 for four weeks after
# the RAK image started shipping beside it. `just check-firmware-images`
# now refuses a board list that only one of those three surfaces knows.
#
# amd64 only: the firmware and the SoftDevice in it are architecture-
# independent, but the host binary is not, and the bundle's own
# --check-bundle gate cannot run an aarch64 binary on the amd64 runner.
#
# ONE-TIME SETUP — configure a cron schedule in the Woodpecker web UI
# (Repo → Settings → Crons). YAML cannot declare the cron itself; this
# file only reacts to the `event: cron` trigger it produces. Suggested
# schedule: `0 2 * * *` (02:00 UTC daily).
#
# Authentication for the publish step uses a Codeberg API token
# (write:repository scope) supplied via the Woodpecker secret
# `codeberg_token`. NETRC is only visible inside the clone step,
# not in user-defined steps, so a manual token is required.

# Two triggers. The nightly cron is what publishes; the push trigger is
# a guard, and only builds. Packaging changes were previously unbuildable
# before merge — `when: event: cron` alone meant a broken manifest first
# showed up in the following night's run, and then only to whoever
# thought to look at the releases page. That is exactly how commit
# 4c580cc5 stalled the release for eight days. The paths listed here are
# the inputs to the .deb build and nothing else, so ordinary commits do
# not pay for a packaging build.
when:
  - event: cron
  - event: push
    path:
      include:
        - '.woodpecker/**'
        - 'scripts/build-deb.sh'
        - 'scripts/deb-stamp.sh'
        - 'scripts/deb-finalize.sh'
        - 'scripts/collect-nightly-debs.sh'
        - 'scripts/md2man.py'
        - 'docs/src/man/**'
        - 'packaging/**'
        - 'leviculum-cli/Cargo.toml'
        - 'lnomad/Cargo.toml'
        - 'lblogd/Cargo.toml'
        - 'lnpnd/Cargo.toml'
        # Codeberg #288: every .deb, every userspace tarball and the
        # lnflash bundle install this file. It is generated (see
        # scripts/gen-notices.py) but tracked, so from this pipeline's
        # point of view it is an ordinary packaging input, and a commit
        # that changes it should prove the packages still build.
        - 'THIRD-PARTY-NOTICES'
        # lnflash bundle inputs. lnflash/** in full rather than just its
        # Cargo.toml, because the crate carries payload/ — the SoftDevice
        # blob, its licence file and the bundle README all end up inside
        # the tarball, and lnflash's own --check-bundle is the gate the
        # bundle script runs before packing. A missing licence file is a
        # packaging break, not a code change.
        #
        # From leviculum-nrf only the files that decide whether the
        # firmware can be built and converted at all: the linker script,
        # the build script, the dependency set and the UF2 writer. Not
        # src/** — firmware source churn is ordinary commit traffic here,
        # and making every one of those commits pay for a full .deb
        # pipeline is exactly what the paragraph above is avoiding. A
        # firmware compile break still turns the next nightly red.
        - 'scripts/lnflash-bundle.sh'
        - 'lnflash/**'
        - 'leviculum-nrf/Cargo.toml'
        - 'leviculum-nrf/Cargo.lock'
        - 'leviculum-nrf/build.rs'
        - 'leviculum-nrf/memory.x'
        - 'leviculum-nrf/tools/bin2uf2.rs'

# Skip submodule init: reference/ holds the Python reference Reticulum
# implementation and two firmware reference repos, none of which the
# .deb build or the gate step touches (Codeberg #300 moved the last
# compile-time fixture reads out of them). Saves bandwidth + clone time
# on every step.
clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      recursive: false
      submodules: false

steps:
  # Codeberg #266: this pipeline published .debs to strangers without ever
  # running a test. It is first because that is the whole point — steps run
  # serially in file order, and a non-zero exit here terminates the workflow,
  # so build, package and publish are never reached with a red commit. The two
  # cron-only steps below do NOT escape that: their `when:` sets no `status:`,
  # and the default is success-only (Woodpecker 3.17 workflow syntax, the
  # version ci.codeberg.org runs: "By default, steps only run when the workflow
  # has succeeded up to that point, which is equivalent to status: [success]").
  #
  # The gate itself is `just ci-gate`, defined in the Justfile — see the note
  # in build-amd64 below on why the commands are not spelled out here. The
  # provisioning this container needs before the recipe can run is in
  # `scripts/ci-gate.sh`, which names what each package is forced by, for the
  # same reason: `.woodpecker/ci.yml` (#299) provisions the same gate on every
  # push, and a package one file grows and the other does not is a gate that
  # passes there and dies in cc-rs here, a night after the commit that did it.
  #
  # That push gate does not make this step redundant. This is the one that
  # stands between a cron run and the public releases page; the two overlap
  # only on commits touching the packaging paths above, and on those the
  # overlap is three minutes of insurance, not a second source of truth.
  gate:
    image: rust:bookworm
    commands:
      - bash scripts/ci-gate.sh

  build-amd64:
    image: rust:bookworm
    commands:
      # python3: scripts/build-deb.sh renders the manual pages the .deb
      # manifests install from. It is stdlib-only by design, so the
      # interpreter is the whole dependency.
      - apt-get update && apt-get install -y musl-tools python3
      - cargo install --locked cargo-deb
      - rustup target add x86_64-unknown-linux-musl
      # Pin the build ID + per-package DEB versions once and persist
      # them, so all subsequent steps see exactly the same values (no
      # midnight-UTC drift between build-amd64 and build-arm64). The
      # logic lives in a script shared with the Justfile's build-deb*
      # recipes; it takes the commit from CI_COMMIT_SHA when set and
      # from git otherwise. Keeping it out of this file also keeps it
      # clear of Woodpecker's pre-substitutor, which rewrites
      # brace-style references in the raw YAML before any shell sees
      # them and expands unknown names to empty without warning.
      - bash scripts/deb-stamp.sh
      # Everything from here to the finished .debs — manual pages, clean,
      # build, cargo deb, deb-finalize — is one script, shared with the
      # Justfile's build-deb-amd64. Spelling the steps out here a second
      # time is what broke the nightly for eight days.
      - bash scripts/build-deb.sh amd64

  build-arm64:
    image: rust:bookworm
    commands:
      # cargo-zigbuild uses Zig as the C compiler/linker — the only way
      # to cross-compile to aarch64-musl from an amd64 rust:bookworm
      # image without docker-in-docker or a dedicated arm64 runner.
      - apt-get update && apt-get install -y python3 python3-pip python3-venv xz-utils curl
      - python3 -m venv /opt/zigvenv && /opt/zigvenv/bin/pip install cargo-zigbuild ziglang
      - export PATH="/opt/zigvenv/bin:$PATH"
      - cargo install --locked cargo-deb
      - rustup target add aarch64-unknown-linux-musl
      # No re-stamp here: build-amd64 already wrote .build-id and the
      # .deb-version-* files, and this step must reuse them verbatim so
      # the two architectures ship identical version strings. The script
      # reads them rather than deriving versions of its own, which is
      # what makes reusing them the default instead of a discipline.
      - bash scripts/build-deb.sh arm64

  build-lnflash:
    image: rust:bookworm
    commands:
      # The firmware toolchain, derived from what scripts/lnflash-bundle.sh
      # actually invokes:
      #   flip-link            — leviculum-nrf/.cargo/config.toml names it as
      #                          the linker for thumbv7em-none-eabihf; without
      #                          it the firmware build fails at link.
      #   thumbv7em-none-eabihf — the firmware target itself.
      #   llvm-tools           — supplies llvm-objcopy, which the script finds
      #                          under the rustc sysroot to flatten the ELF
      #                          before bin2uf2. (arm-none-eabi-binutils would
      #                          do, but it is a ~150 MB apt pull for one tool
      #                          rustup already ships.)
      #   x86_64-unknown-linux-musl — the host binary in the bundle, per the
      #                          workspace-wide musl default. rust-lld links
      #                          it, so no musl-tools here.
      # No C toolchain: the t114 feature set pulls no bindgen/cc build
      # scripts. git is already in the image and is needed both for the
      # nrf-softdevice git dependency and for the git_sha the manifest
      # records.
      - rustup target add thumbv7em-none-eabihf x86_64-unknown-linux-musl
      - rustup component add llvm-tools
      - cargo install --locked flip-link
      # No SKIP_FIRMWARE: a published bundle must carry a firmware image
      # built from the commit it claims, and the vendored Nordic S140
      # blob it ships beside it. The script ends by running the bundle's
      # own --check-bundle, so a mismatched checksum fails the step here
      # rather than on somebody's board.
      - bash scripts/lnflash-bundle.sh

  # Staging and publishing are cron-only. A push build exists to prove
  # the packages still build; letting it reach these two steps would let
  # any packaging commit replace the rolling release with a mid-day
  # build of whatever was just pushed.
  #
  # Being cron-only means NO GATE RUNS THEM. That is not a detail: the
  # rolling release stood still from 2026-08-24 to 2026-09-18 while every
  # push pipeline in those five weeks was green, because 03e2cb95 put a
  # `cargo metadata` call on a path that runs down here, in an image with
  # no cargo. What covers the two steps instead is a pair of fixture tests
  # in `just fast` — `package-selftest` and `publish-selftest` — which run
  # the real scripts against a fixture tree and a fake forge. A tool added
  # to either script that this image does not have must be apt-installed on
  # the step that uses it, and the fixture tests are what notice when it
  # is not: their PATH is exactly the list below.
  #
  # What this step's script may use, and where each comes from:
  #   bash, coreutils (cat cp head ls mkdir rm sha256sum), sed, tar, gzip
  #                    — debian:bookworm-slim ships all of these
  #   git              — apt-installed here, for `git archive HEAD`
  #   cargo, python3   — NOT available and not used. Where cargo writes is
  #                      read from .cargo-target-dir, which the rust:bookworm
  #                      step above stamped, exactly as .build-id is.
  package:
    image: debian:bookworm-slim
    when:
      event: cron
    commands:
      - apt-get update && apt-get install -y git
      - export LEVICULUM_BUILD_ID="$(cat .build-id)"
      - bash scripts/collect-nightly-debs.sh

  publish:
    image: debian:bookworm-slim
    when:
      event: cron
    environment:
      CODEBERG_TOKEN:
        from_secret: codeberg_token
    commands:
      # Same inventory discipline as `package` above. This script may use:
      #   bash, coreutils (basename cat date mktemp rm sha256sum), sed
      #                    — debian:bookworm-slim ships all of these. `date`
      #                      joined the list with Codeberg #312: the nightly
      #                      gate below converts a ref name to an epoch and
      #                      ages it against a bound.
      #   curl, jq         — apt-installed here, for the forge API
      #   git              — apt-installed here, and now for two things.
      #                      publish-nightly.sh force-pushes the `nightly` tag
      #                      to the built commit at the end, because the API
      #                      refresh path never moves the git ref, only release
      #                      creation does. And since #312 it first reads the
      #                      tier-2 nightly's verdict off the remote
      #                      (ls-remote + fetch + merge-base), because
      #                      rnsd_interop runs in no forge pipeline and the
      #                      interop truth has to be imported rather than
      #                      re-derived here — see scripts/check-nightly-green.sh
      #                      and docs/src/development-ci.md.
      #   python3          — NOT available and not used. The gate is bash,
      #                      coreutils and sed for exactly that reason; the
      #                      signing half (scripts/nightly-green-ref.sh) runs
      #                      on the nightly host, where python3 is, and reads
      #                      the run manifest there.
      #   ca-certificates  — NOT in the slim image and never named here. It
      #                      arrives as a Recommends of curl and of git, so
      #                      an `--no-install-recommends` added to this line
      #                      to save a few seconds would break every HTTPS
      #                      request in the step.
      - apt-get update && apt-get install -y curl jq git
      - export LEVICULUM_BUILD_ID="$(cat .build-id)"
      - bash scripts/publish-nightly.sh

  # The second publish target: our own site. Every download link we hand out
  # — README, lblogd/README.md, the miauhaus update procedure — points at the
  # forge's rolling release, so a forge outage today breaks every install
  # instruction we have written down, and the day the project leaves that
  # forge it breaks them for good. The URL under leviculum.network is the one
  # we can keep; this step is what puts a build behind it.
  #
  # ORDERING: last, after `publish`. The forge publish is the incumbent and
  # keeps its position and its timing exactly — a step that runs after it
  # cannot delay it, cannot consume its quota, and cannot leave it half done.
  #
  # `status: [success, failure]`: this step runs EVEN IF an earlier step
  # failed, and that is the whole point of having a second target. A forge
  # outage is precisely the night the site copy matters, and with the default
  # success-only `when:` a 500 from the forge would take the independent
  # target down with it. The reverse independence is bought by the ordering:
  # by the time this runs, the forge publish has already happened.
  #
  # No `failure: ignore`: a failed site publish fails the pipeline. An
  # ignored failure on a cron job nobody watches is a download URL that
  # silently stops updating, which is the shape of bug this whole step exists
  # to end (the rolling release stood still for five weeks in exactly that
  # way). The cost of running after a failed build is one line, not a second
  # red: scripts/publish-site.sh exits 0 saying "nothing was built" when
  # there is no dist/ at all, because that is the earlier step's failure and
  # not this one's. An empty dist/ IS this step's failure and is refused.
  #
  # Same inventory discipline as the two steps above. This script may use:
  #   bash, coreutils (cat cp mktemp printf rm wc), tar
  #                    — debian:bookworm-slim ships all of these
  #   ssh              — apt-installed here (openssh-client)
  #   ca-certificates  — NOT needed: this step speaks ssh, not HTTPS.
  #   cargo, python3, curl, jq — NOT available and not used.
  # `just site-publish-selftest` runs the real sender against the real
  # receiver on every push, which is what notices when that list grows.
  #
  # The three inputs are the ssh target, the private key, and the receiving
  # host's public key. The host key is PINNED: scripts/publish-site.sh runs
  # with StrictHostKeyChecking=yes against a known_hosts file holding that
  # one entry and nothing else. There is no accept-on-first-use — an
  # unattended job cannot recognise a host it has never seen.
  #
  # NO `from_secret` HERE, AND THAT IS THE POINT. A `from_secret` naming a
  # secret the repository does not have is not a step failure in Woodpecker;
  # it is a compile error for the whole pipeline. Cron run #434, on d7979113,
  # ended `status: error, workflows: 0, secret "site_ssh_target" not found` —
  # the gate, both builds, the packaging step and the FORGE publish never
  # started, because a step that was added last and runs last could not be
  # configured. Three weeks of stale .debs behind every download link we hand
  # out, bought by a second target that was supposed to make those links more
  # reliable, not less.
  #
  # So this step reads plain environment variables that are allowed to be
  # unset, and says so in its own log when they are (see the NOT CONFIGURED
  # banner in scripts/publish-site.sh). An unset variable is not an error at
  # any layer: not in Woodpecker's compiler, not in the runner, not in the
  # script. That is a property no `when:` clause and no separate workflow file
  # can buy, because a workflow is its own workspace — a site publish in a
  # second file would have no dist/ to publish and would have to rebuild the
  # whole nightly to get one, which is two different builds behind two URLs
  # that are supposed to serve the same bytes.
  #
  # TO WIRE THE SITE UP, IN THIS ORDER:
  #   1. create the repository secrets `site_ssh_target`, `site_ssh_key` and
  #      `site_ssh_host_key` in the Woodpecker UI, and confirm they appear in
  #      the repository's secret list;
  #   2. add their names to scripts/ci-secrets.txt;
  #   3. in the SAME commit, add the environment block back:
  #
  #        environment:
  #          SITE_SSH_TARGET:
  #            from_secret: site_ssh_target
  #          SITE_SSH_KEY:
  #            from_secret: site_ssh_key
  #          SITE_SSH_HOST_KEY:
  #            from_secret: site_ssh_host_key
  #
  # Step 1 before step 3 is the whole lesson of #434, and `just
  # check-ci-secrets` is what refuses a push that does 3 without 2.
  publish-site:
    image: debian:bookworm-slim
    when:
      - event: cron
        status: [success, failure]
    commands:
      - apt-get update && apt-get install -y openssh-client
      # No `export LEVICULUM_BUILD_ID=$(cat .build-id)` here: the script
      # reads .build-id itself, so a run where the build never got that far
      # reaches the script's own "nothing was built" line instead of dying in
      # `cat` with a message about a missing file.
      - bash scripts/publish-site.sh
