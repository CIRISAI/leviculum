# Nightly build pipeline for leviculum.
#
# Builds two musl-static .deb packages (amd64 + arm64) and uploads
# them to a rolling `nightly` release on Codeberg. Assets are
# overwritten each run, so these download URLs stay stable:
#
#   https://codeberg.org/Lew_Palm/leviculum/releases/download/nightly/leviculum-nightly-amd64.deb
#   https://codeberg.org/Lew_Palm/leviculum/releases/download/nightly/leviculum-nightly-arm64.deb
#
# The lnomad terminal browser ships as its own .deb + tarball (it must
# not pull in the auto-started lnsd service that the leviculum package
# sets up):
#
#   https://codeberg.org/Lew_Palm/leviculum/releases/download/nightly/lnomad-nightly-amd64.deb
#   https://codeberg.org/Lew_Palm/leviculum/releases/download/nightly/lnomad-nightly-arm64.deb
#
# So does the lblogd dev-blog server, which installs a systemd service of
# its own:
#
#   https://codeberg.org/Lew_Palm/leviculum/releases/download/nightly/lblogd-nightly-amd64.deb
#   https://codeberg.org/Lew_Palm/leviculum/releases/download/nightly/lblogd-nightly-arm64.deb
#
# lnomad and lblogd carry their own version numbers, independent of the
# leviculum stack's; scripts/deb-stamp.sh derives one Debian version per
# package.
#
# ONE-TIME SETUP — configure a cron schedule in the Woodpecker web UI
# (Repo → Settings → Crons). YAML cannot declare the cron itself; this
# file only reacts to the `event: cron` trigger. Suggested schedule:
# `0 2 * * *` (02:00 UTC daily).
#
# Authentication for the publish step uses a Codeberg API token
# (write:repository scope) supplied via the Woodpecker secret
# `codeberg_token`. NETRC is only visible inside the clone step,
# not in user-defined steps, so a manual token is required.

when:
  event: cron

# Skip submodule init: reference/ holds the Python reference Reticulum
# implementation and two firmware reference repos, none of which the
# .deb build touches. Saves bandwidth + clone time on every step.
clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      recursive: false
      submodules: false

steps:
  build-amd64:
    image: rust:bookworm
    commands:
      - apt-get update && apt-get install -y musl-tools
      - cargo install --locked cargo-deb
      - rustup target add x86_64-unknown-linux-musl
      # Pin the build ID + per-package DEB versions once and persist
      # them, so all subsequent steps see exactly the same values (no
      # midnight-UTC drift between build-amd64 and build-arm64). The
      # logic lives in a script shared with the Justfile's build-deb*
      # recipes; it takes the commit from CI_COMMIT_SHA when set and
      # from git otherwise. Keeping it out of this file also keeps it
      # clear of Woodpecker's pre-substitutor, which rewrites
      # brace-style references in the raw YAML before any shell sees
      # them and expands unknown names to empty without warning.
      - bash scripts/deb-stamp.sh
      - export LEVICULUM_BUILD_ID="$(cat .build-id)"
      # `cargo clean` on the bin crates avoids a Cargo incremental quirk
      # where repeated builds with the same LEVICULUM_BUILD_ID skip
      # relinking some binaries, leaving them with a stale version
      # string. Fresh containers rarely hit this, but the clean is
      # cheap insurance.
      - cargo clean -p leviculum-cli -p lnomad -p lblogd
      - cargo build --release --target x86_64-unknown-linux-musl --bin lnsd --bin lnstest --bin lncp --bin lnstatus --bin lnomad --bin lblogd
      # One --deb-version per package: the three are versioned
      # independently, so a single shared version string would be wrong
      # for at least two of them.
      # --no-strip: rust strips debuginfo at link time (see workspace
      # Cargo.toml [profile.release] strip = "debuginfo"). cargo-deb's
      # default strip --strip-all corrupted x86_64 musl-static binaries
      # (SIGSEGV at startup), so we skip it entirely.
      - cargo deb -p leviculum-cli --target x86_64-unknown-linux-musl --no-build --no-strip --deb-version "$(cat .deb-version-leviculum-cli)"
      - cargo deb -p lnomad --target x86_64-unknown-linux-musl --no-build --no-strip --deb-version "$(cat .deb-version-lnomad)"
      - cargo deb -p lblogd --target x86_64-unknown-linux-musl --no-build --no-strip --deb-version "$(cat .deb-version-lblogd)"

  build-arm64:
    image: rust:bookworm
    commands:
      # cargo-zigbuild uses Zig as the C compiler/linker — the only way
      # to cross-compile to aarch64-musl from an amd64 rust:bookworm
      # image without docker-in-docker or a dedicated arm64 runner.
      - apt-get update && apt-get install -y python3 python3-pip python3-venv xz-utils curl
      - python3 -m venv /opt/zigvenv && /opt/zigvenv/bin/pip install cargo-zigbuild ziglang
      - export PATH="/opt/zigvenv/bin:$PATH"
      - cargo install --locked cargo-deb
      - rustup target add aarch64-unknown-linux-musl
      # No re-stamp here: build-amd64 already wrote .build-id and the
      # .deb-version-* files, and this step must reuse them verbatim so
      # the two architectures ship identical version strings.
      - export LEVICULUM_BUILD_ID="$(cat .build-id)"
      - cargo clean -p leviculum-cli -p lnomad -p lblogd
      - cargo zigbuild --release --target aarch64-unknown-linux-musl --bin lnsd --bin lnstest --bin lncp --bin lnstatus --bin lnomad --bin lblogd
      - cargo deb -p leviculum-cli --target aarch64-unknown-linux-musl --no-build --no-strip --deb-version "$(cat .deb-version-leviculum-cli)"
      - cargo deb -p lnomad --target aarch64-unknown-linux-musl --no-build --no-strip --deb-version "$(cat .deb-version-lnomad)"
      - cargo deb -p lblogd --target aarch64-unknown-linux-musl --no-build --no-strip --deb-version "$(cat .deb-version-lblogd)"

  package:
    image: debian:bookworm-slim
    commands:
      # git for the source tarball (`git archive HEAD`); coreutils for
      # sha256sum is already in the slim image.
      - apt-get update && apt-get install -y git
      - export LEVICULUM_BUILD_ID="$(cat .build-id)"
      - bash scripts/collect-nightly-debs.sh

  publish:
    image: debian:bookworm-slim
    environment:
      CODEBERG_TOKEN:
        from_secret: codeberg_token
    commands:
      - apt-get update && apt-get install -y curl jq
      - export LEVICULUM_BUILD_ID="$(cat .build-id)"
      - bash scripts/publish-nightly.sh
