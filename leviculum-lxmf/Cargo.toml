[package]
name = "leviculum-lxmf"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "no_std LXMF messaging protocol for leviculum"

[features]
default = ["pow"]
# Enables proof-of-work generation and validation. Embedded applications that
# advertise a zero stamp cost can disable this to minimise code size.
pow = ["dep:sha2"]

[dependencies]
leviculum-core = { path = "../leviculum-core", default-features = false, features = ["compression"] }
rand_core.workspace = true
sha2 = { workspace = true, optional = true }
rmp.workspace = true

[dev-dependencies]
hex = "0.4"
futures = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2.workspace = true
