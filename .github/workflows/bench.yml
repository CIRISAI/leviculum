name: bench

# Runs the native transport fan-out benchmark (leviculum#29), turns the sweep
# into an interpreted page (throughput-vs-active-links, with the serialization
# ceiling drawn in), and publishes to GitHub Pages. Mirrors CIRISServer's
# publish-only bench discipline — a published TREND, not a pass/fail gate
# (shared runners are noisy) — with an interpretation layer on top
# (scripts/bench_report.py).
#
# Published at: https://cirisai.github.io/leviculum/
# One-time: Settings -> Pages -> Source = "GitHub Actions" (the configure-pages
# step sets enablement: true to do this automatically on first run).

on:
  push:
    branches: [main]
    paths:
      - "leviculum-std/tests/transport_fanout_bench.rs"
      - "scripts/bench_report.py"
      - ".github/workflows/bench.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight Pages deploy; let bench runs serialize.
concurrency:
  group: bench-pages
  cancel-in-progress: false

jobs:
  bench-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # Conservative sweep for a shared runner: enough points to show the
      # plateau without a long tail of many-node setups. Tune via re-dispatch.
      SIZES: "1 10 20 40"
      PACKETS: "300"
      PAYLOAD: "64"
      LOAD_DEADLINE: "90"
    steps:
      - uses: actions/checkout@v4
      # The workspace defaults to x86_64-unknown-linux-musl (.cargo/config.toml),
      # so every cargo invocation needs the musl linker.
      - name: install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the benchmark (release — what the field runs)
        run: cargo test --release -p leviculum-std --test transport_fanout_bench --no-run

      - name: Run the fan-out sweep, emit bench_results.json
        run: |
          GIT_COMMIT="$GITHUB_SHA" \
          BENCH_DATE="$(date -u +%Y-%m-%d)" \
          BENCH_RUNNER="github/ubuntu-latest (release)" \
          BENCH_JSON_OUT="$PWD/bench_results.json" \
            cargo test --release -p leviculum-std --test transport_fanout_bench \
              transport_fanout_sweep -- --ignored --nocapture
          echo "── emitted bench_results.json ──"; cat bench_results.json

      - name: Run the outbound-under-flood mode (sealed-envelope field case)
        run: |
          FLOOD_N=20 RESOURCE_KIB=1024 RESOURCE_SENDS=10 COMPRESS=1 \
          BENCH_JSON_OUT_OUTBOUND="$PWD/bench_outbound.json" \
            cargo test --release -p leviculum-std --test transport_fanout_bench \
              outbound_resource_latency_under_flood -- --ignored --nocapture
          echo "── emitted bench_outbound.json ──"; cat bench_outbound.json

      # Budget: <=2 min — 5,000 ECDH datagrams are ~1 s of load; wall time is
      # node bring-up + test spawn.
      - name: Run the single-dest datagram flood (mode 3, ECDH/packet)
        run: |
          FLOOD_N=20 PACKETS=250 PAYLOAD=64 \
          BENCH_JSON_OUT_SINGLEDEST="$PWD/bench_singledest.json" \
            cargo test --release -p leviculum-std --test transport_fanout_bench \
              single_dest_datagram_flood -- --ignored --nocapture
          echo "── emitted bench_singledest.json ──"; cat bench_singledest.json

      # Budget: <=2 min — 1,500 Ed25519 verifies are ~1 s of load; wall time
      # is node bring-up + test spawn.
      - name: Run the announce flood (mode 4, Ed25519 verify/announce)
        run: |
          FLOOD_N=10 ANNOUNCES=150 \
          BENCH_JSON_OUT_ANNOUNCE="$PWD/bench_announce.json" \
            cargo test --release -p leviculum-std --test transport_fanout_bench \
              announce_verify_flood -- --ignored --nocapture
          echo "── emitted bench_announce.json ──"; cat bench_announce.json

      # Budget: typical 3-6 min — (8+16+32+64)x3 = 360 dances x ~1,130 parts
      # ≈ 407k serve-side part-decrypts ≈ 40-60 s at the ~10k pkts/s ceiling,
      # plus ~35-45 s node bring-up. Hard-bounded at 4 x LOAD_DEADLINE(180 s)
      # = 12 min even pathologically, keeping modes 3-5 under ~15 min total.
      - name: Run the link-dance sweep (mode 5, consumer unit of work)
        run: |
          DANCE_SIZES="8 16 32 64" ROUNDS=3 RESOURCE_KIB=512 \
          ESTABLISH_TIMEOUT=15 TRANSFER_TIMEOUT=60 STALL_SECS=15 LOAD_DEADLINE=180 \
          GIT_COMMIT="$GITHUB_SHA" \
          BENCH_DATE="$(date -u +%Y-%m-%d)" \
          BENCH_RUNNER="github/ubuntu-latest (release)" \
          BENCH_JSON_OUT_LINKDANCE="$PWD/bench_linkdance.json" \
            cargo test --release -p leviculum-std --test transport_fanout_bench \
              link_dance_sweep -- --ignored --nocapture
          echo "── emitted bench_linkdance.json ──"; cat bench_linkdance.json

      - name: Render the interpreted page
        run: |
          python3 scripts/bench_report.py \
            --bench-results bench_results.json \
            --outbound-results bench_outbound.json \
            --out bench-site \
            --commit "$GITHUB_SHA" \
            --date "$(date -u +%Y-%m-%d)"

      # bench_report.py does not render modes 3-5 yet; Pages serves the raw
      # trend JSON alongside the rendered page.
      - name: Publish the modes 3-5 raw JSON into the Pages site
        run: cp bench_singledest.json bench_announce.json bench_linkdance.json bench-site/

      - name: Upload bench_results.json + rendered site as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            bench_results.json
            bench_outbound.json
            bench_singledest.json
            bench_announce.json
            bench_linkdance.json
            bench-site
          if-no-files-found: error

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: bench-site
      - id: deploy
        uses: actions/deploy-pages@v4
