# +ciris: live NAT punch diagnostics. Dials a `punch-probe listen` running
# elsewhere, over the relay, from each OS's hosted runner, and keeps each
# runner's JSON lines. Manual dispatch only: never on push or pull request.
#
# The tool prints no IP address or port (counts and classes only), so the
# logs and artifacts are safe to keep. The relay dial is public.
name: punch-probe

on:
  # TEMPORARY: this one diagnostic branch only (workflow_dispatch needs the
  # file on the default branch, which this must not touch). Inputs then come
  # from .github/punch-probe.env. Removed right after the run.
  push:
    branches: [diag/punch-telemetry]
  workflow_dispatch:
    inputs:
      role:
        description: "dial (runners dial the listener) or listen (runners listen; dial them)"
        required: false
        default: "dial"
      dest:
        description: "listener destination hash (hex); dial only"
        required: false
        default: ""
      key:
        description: "listener signing key (hex); dial only"
        required: false
        default: ""
      listen_secs:
        description: "how long a listening runner stays up"
        required: false
        default: "900"
      relay:
        description: "relay TCP dial = UDP facilitator (host:port)"
        required: true
      attempts:
        description: "proposals per runner"
        required: false
        default: "3"
      stun:
        description: "public STUN server for the mapping check (empty: skip)"
        required: false
        default: "stun.l.google.com:19302"

permissions:
  contents: read

concurrency:
  group: punch-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dial:
    name: probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # TEMPORARY for this run: three Ubuntu VMs, to land on one behind
          # an endpoint-dependent NAT (run 44930393845's ubuntu was).
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: build punch-probe
        run: cargo build --release -p leviculum-cli --no-default-features --bin punch-probe
      - name: run
        shell: bash
        env:
          IN_ROLE: ${{ inputs.role }}
          IN_DEST: ${{ inputs.dest }}
          IN_KEY: ${{ inputs.key }}
          IN_RELAY: ${{ inputs.relay }}
          IN_ATTEMPTS: ${{ inputs.attempts }}
          IN_LISTEN_SECS: ${{ inputs.listen_secs }}
          IN_STUN: ${{ inputs.stun }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            set -a; . .github/punch-probe.env; set +a
          else
            ROLE=$IN_ROLE DEST=$IN_DEST KEY=$IN_KEY RELAY=$IN_RELAY
            ATTEMPTS=$IN_ATTEMPTS LISTEN_SECS=$IN_LISTEN_SECS STUN=$IN_STUN
          fi
          stun_arg=()
          if [ -n "$STUN" ]; then stun_arg=(--stun "$STUN"); fi
          bin="target/${{ matrix.target }}/release/punch-probe"
          if [ "$ROLE" = "listen" ]; then
            "$bin" --relay "$RELAY" "${stun_arg[@]}" listen --duration-secs "$LISTEN_SECS" \
              | tee "punch-probe-${{ matrix.os }}.jsonl"
          else
            "$bin" --relay "$RELAY" "${stun_arg[@]}" dial --to "$DEST" --key "$KEY" --attempts "$ATTEMPTS" \
              | tee "punch-probe-${{ matrix.os }}.jsonl"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: punch-probe-${{ matrix.os }}
          path: punch-probe-${{ matrix.os }}.jsonl
