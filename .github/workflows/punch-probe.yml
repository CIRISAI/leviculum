# +ciris: live NAT punch diagnostics. Runs `punch-probe` on each OS's hosted
# runner, dialing a listener elsewhere over the relay (or listening, for the
# reverse run), and keeps each runner's JSON lines. Manual dispatch only:
# never on push or pull request.
#
# The tool prints no IP address or port (counts and classes only), so the
# logs and artifacts are safe to keep. The relay dial is public.
#
# Inputs reach the shell only through env, never interpolated into the
# script (review item 9).
name: punch-probe

on:
  # TEMPORARY: this branch only; removed right after the run.
  push:
    branches: [diag/punch-telemetry]
  workflow_dispatch:
    inputs:
      role:
        description: "dial (runners dial the listener) or listen (runners listen; dial them)"
        required: false
        default: "dial"
      dest:
        description: "listener destination hash (hex); dial only"
        required: false
        default: ""
      key:
        description: "listener signing key (hex); dial only"
        required: false
        default: ""
      seed_tag:
        description: "listening runner identity tag (public; its destination is derived from it): <tag>-<os>"
        required: true
      allow:
        description: "listen only: the dialer's PUBLIC identity hash (from `punch-probe keygen`)"
        required: false
        default: ""
      listen_secs:
        description: "how long a listening runner stays up"
        required: false
        default: "900"
      relay:
        description: "relay TCP dial = UDP facilitator (host:port)"
        required: true
      attempts:
        description: "proposals per runner"
        required: false
        default: "3"
      stun:
        description: "public STUN server for the mapping check (empty: skip)"
        required: false
        default: "stun.l.google.com:19302"
      facilitator2:
        description: "TEST ONLY second observer for NAT classification (empty: none)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: punch-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # TEMPORARY for this run: weighted toward ubuntu-24.04, two EIM controls.
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, job: u24a, attempts: 3 }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, job: u24b, attempts: 3 }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, job: u24c, attempts: 3 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, job: ulat, attempts: 2 }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, job: u22, attempts: 2 }
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: build punch-probe
        run: cargo build --release -p leviculum-cli --no-default-features --bin punch-probe
      - name: dialer keygen
        if: false
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          JOB: ${{ matrix.job }}
        run: |
          "target/$TARGET/release/punch-probe" --relay unused keygen --out "$RUNNER_TEMP/dialer.key" \
            | tee "dialer-hash-$JOB.json"
      - name: publish the dialer's public hash
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: dialer-hash-${{ matrix.job }}
          path: dialer-hash-${{ matrix.job }}.json
      - name: run
        shell: bash
        env:
          IN_ROLE: "listen"
          IN_DEST: ""
          IN_KEY: ""
          IN_SEED_TAG: "c2516482919f"
          IN_ALLOW: "3b9557375510799f4973f2aaca4cbc3d"
          IN_RELAY: "108.61.242.236:4242"
          IN_ATTEMPTS: "3"
          IN_LISTEN_SECS: "600"
          IN_STUN: "stun.l.google.com:19302"
          IN_FAC2: "stun.l.google.com:19302"
          JOB: ${{ matrix.job }}
          TARGET: ${{ matrix.target }}
          ATTEMPTS_OVERRIDE: ${{ matrix.attempts }}
        run: |
          ROLE=$IN_ROLE DEST=$IN_DEST KEY=$IN_KEY SEED_TAG=$IN_SEED_TAG RELAY=$IN_RELAY
          ATTEMPTS=$IN_ATTEMPTS LISTEN_SECS=$IN_LISTEN_SECS STUN=$IN_STUN FAC2=$IN_FAC2
          if [ -n "$ATTEMPTS_OVERRIDE" ]; then ATTEMPTS=$ATTEMPTS_OVERRIDE; fi
          extra=()
          if [ -n "$STUN" ]; then extra+=(--stun "$STUN"); fi
          if [ -n "$FAC2" ]; then extra+=(--facilitator2 "$FAC2" --protocol2 stun); fi
          bin="target/$TARGET/release/punch-probe"
          out="punch-probe-$JOB.jsonl"
          if [ "$ROLE" = "listen" ]; then
            "$bin" --relay "$RELAY" "${extra[@]}" listen --duration-secs "$LISTEN_SECS" \
              --seed "$SEED_TAG-$JOB" --allow "$IN_ALLOW" | tee "$out"
          else
            # The dialer's keypair was made on THIS runner (step "dialer
            # keygen"); its private key never leaves it. Only the public hash
            # was published (the dialer-hash artifact, uploaded mid-run), and
            # the listener admits exactly that identity. The dialer retries a
            # proposal the listener refuses by policy until it is admitted.
            "$bin" --relay "$RELAY" "${extra[@]}" dial --to "$DEST" --key "$KEY" \
              --attempts "$ATTEMPTS" --identity-file "$RUNNER_TEMP/dialer.key" | tee "$out"
            rm -f "$RUNNER_TEMP/dialer.key"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: punch-probe-${{ matrix.job }}
          path: punch-probe-${{ matrix.job }}.jsonl
