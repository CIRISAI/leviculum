[package]
name = "leviculum-proxy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "KISS-aware serial proxy for LoRa fault injection testing"

[lib]
name = "lora_proxy"
path = "src/lib.rs"

[[bin]]
name = "lora-proxy"
path = "src/main.rs"

[dependencies]
leviculum-core = { path = "../leviculum-core" }
tokio = { workspace = true }
tokio-serial = { workspace = true }
nix = { version = "0.29", features = ["fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
# For `process::spawn_supervised` in tests/log_backpressure.rs. That test's
# child is a proxy that holds two PTYs and runs until it is killed, which is
# exactly the long-lived child `scripts/check-supervised-spawns.py` refuses to
# let a harness spawn bare. Test-only, so the shipped `lora-proxy` binary still
# links nothing but leviculum-core.
leviculum-std = { path = "../leviculum-std" }
