[package]
name = "lnpnd"
# Versioned independently of the leviculum stack, like loquax and lnomad: a
# mailbox daemon's releases track its own storage format and operator
# surface, not the protocol core it is built from.
version = "0.1.7"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "LXMF propagation node daemon for Reticulum — the host-side mailbox role"

[lints.rust]
unsafe_code = "forbid"

[package.metadata.deb]
name = "lnpnd"
maintainer = "Lew Palm <lp@lew-palm.de>"
copyright = "2026, Lew Palm"
license-file = ["../LICENSE", "0"]
extended-description = """\
lnpnd runs an LXMF propagation node -- a store-and-forward mailbox on a
Reticulum mesh. Clients (Sideband, MeshChat, lxmd-based tools) configure
its destination hash as their propagation node; messages for offline
recipients wait in its store, and the node peers with other propagation
nodes and syncs stored messages both ways.

lnpnd is a drop-in counterpart to Python's lxmd: it reads lxmd's config
file format and keys, keeps lxmd's config-directory layout, answers the
same remote-management queries (lxmd --status --remote works against it
and vice versa), and carries its own LXMF mailbox with an on_inbound
hook.

The package installs lnpnd as a systemd service under a dedicated
'lnpnd' user. The unit is enabled but not started by the installation:
a node's identity is its address on the mesh, and starting the daemon
before the operator has placed one would mint a throwaway address and
announce it. Put an existing identity at /etc/lnpnd/identity, or accept
that the first start creates one, then start the service.

lnpnd attaches to a running Reticulum shared instance -- lnsd from the
'leviculum' package, or the Python rnsd.
"""
section = "net"
priority = "optional"
# Both entries are real: adduser because postinst creates the service
# user; the binary itself is musl-static with no library dependencies.
# leviculum is a Recommends rather than a Depends for the same reason as
# in lblogd: the daemon needs *a* Reticulum shared instance, and the
# Python rnsd is equally valid.
depends = "adduser"
recommends = "leviculum"
# The heap-accounting variant below is the same package with an
# instrumented binary, so the two swap each other out on install (550).
conflicts = "lnpnd-heapacct"
replaces = "lnpnd-heapacct"
assets = [
    # cargo-deb only recognises "target/release/..." exactly as a Cargo
    # target path and auto-substitutes the --target triple into it. Any
    # prefix disables the rewrite and silently picks up stale non-musl
    # builds -- see leviculum-cli/Cargo.toml.
    ["target/release/lnpnd", "usr/bin/", "755"],
    # Rendered from docs/src/man/ by scripts/md2man.py, which the
    # build-deb recipes run before this; cargo-deb gzips it itself.
    ["../target/man/lnpnd.1", "usr/share/man/man1/lnpnd.1", "644"],
    ["README.md", "usr/share/doc/lnpnd/README.md", "644"],
    # Documented overrides for the two lintian tags a musl-static binary
    # always trips.
    ["../packaging/lintian/lnpnd", "usr/share/lintian/overrides/lnpnd", "644"],
    # Codeberg #288; see leviculum-cli/Cargo.toml for what this file is
    # and why a musl-static package needs it.
    ["../THIRD-PARTY-NOTICES", "usr/share/doc/lnpnd/THIRD-PARTY-NOTICES", "644"],
]
# Generated per build by scripts/deb-stamp.sh, because Debian wants the
# top entry to carry this build's version and the version is stamped.
changelog = "../target/deb-changelog/lnpnd"
maintainer-scripts = "../packaging/lnpnd/"

[package.metadata.deb.systemd-units]
unit-name = "lnpnd"
unit-scripts = "../packaging/lnpnd/"
enable = true
# Enabled but NOT started by the installation, which is cargo-deb's
# rendering of `dh_installsystemd --no-start`. On 2026-09-17 installing
# this package started the daemon straight out of dpkg; with no identity
# and no config in place yet it minted an address of its own and
# announced it on the public network for 33 seconds. Nobody had had a
# chance to put the node's real identity at /etc/lnpnd/identity, because
# the package had not finished installing.
#
# `start = false` together with `restart-after-upgrade = true` is exactly
# the pair of behaviours this needs (measured against cargo-deb 3.7.0, on
# the generated postinst): a fresh install ($2 empty) only runs
# `daemon-reload`, while an upgrade ($2 set) runs `try-restart`, which
# brings a node that was running back and leaves a stopped one stopped.
# Asserted on the built .deb in scripts/verify-deb-packaging.sh, and on
# this file in lnpnd/tests/first_start_identity.rs, because the packaging
# script is deliberately outside every test tier.
start = false
restart-after-upgrade = true

# 550: the instrumented build for memory censuses on the soak node, not for
# daily use. Same unit, same service user, same maintainer scripts; only the
# binary is rebuilt with `--features heap-accounting` (scripts/build-deb.sh),
# so its SIGUSR1 census carries measured live bytes. Built with `cargo deb
# --variant heapacct`; the version gets a `+heapacct` suffix there, and
# `lnpnd --version` says the same. Named explicitly for the reason
# leviculum-cli's variants are: cargo-deb keeps the base name otherwise and
# deletes the plain package it finds under the same name.
[package.metadata.deb.variants.heapacct]
name = "lnpnd-heapacct"
conflicts = "lnpnd"
replaces = "lnpnd"
provides = "lnpnd"
extended-description = """\
lnpnd runs an LXMF propagation node -- a store-and-forward mailbox on a
Reticulum mesh, and a drop-in counterpart to Python's lxmd.

This is the heap-accounting build of the lnpnd package: the same daemon,
but it counts every allocation, so its SIGUSR1 memory census reports
measured live heap bytes beside the modelled total. It costs a few atomic
operations per allocation and exists for memory investigations on a field
node, not for daily use. It conflicts with and replaces the plain lnpnd
package; installing either one swaps the other out.
"""

# Off by default, like lnsd's (leviculum-cli/Cargo.toml): with it, lnpnd
# installs `leviculum_std::heap_accounting::CountingAllocator` as its global
# allocator, and the SIGUSR1 dump gains the measured live-bytes line and a
# gap line that subtracts it (550). lnpnd is the daemon that will hold the
# public store for weeks, and VmData alone cannot tell a table that grows by
# design from a leak.
#
#   cargo build --release -p lnpnd --features heap-accounting
[features]
# `ble`, `serial` and `i2p` forward leviculum-std's interface families (#463). They
# are lnpnd's defaults so a config with a BLE or serial section behaves as it
# did before the split; they are forwarded rather than left to leviculum-std's
# own defaults so that leviculum-std, which takes lnpnd as a dev-dependency,
# can test its minimal set without this edge switching both back on.
#
# `alloc-mimalloc` is default for the reason it is lnsd's (#437, 766;
# leviculum-cli/Cargo.toml): the lnpnd on miauhaus (902bc129, LV-1000) grew
# its resident set by about 70 MB an hour in fresh mid-size anonymous
# mappings while every table its census knows stayed flat, the retention
# musl's mallocng showed under lnsd before lnsd moved to mimalloc (order
# 1592). `--no-default-features --features ble,serial,i2p` builds lnpnd on
# the libc allocator; scripts/build-deb.sh does so under
# LEVICULUM_ALLOC=system. With `heap-accounting` as well, the counting shim
# wraps mimalloc, so the census still reports live bytes.
default = ["alloc-mimalloc", "ble", "serial", "i2p"]
ble = ["leviculum-std/ble"]
serial = ["leviculum-std/serial"]
i2p = ["leviculum-std/i2p"]
heap-accounting = ["leviculum-std/heap-accounting"]
alloc-mimalloc = ["dep:mimalloc"]

[dependencies]
# The propagation-node role, the store trait, and the wire codecs.
leviculum-lxmf = { path = "../leviculum-lxmf" }
# The driver seam. Uploads arrive as `LinkDataReceived`, which is a
# Data-class event the public receiver may drop under load, so the role runs
# as a `CoreProcessor` inside the driver's tick — the same reasoning as
# loquax's engine (docs/src/concepts/loquax-architecture.md §3). Default
# features off, see `[features]`.
leviculum-std = { path = "../leviculum-std", default-features = false, features = ["compression"] }
leviculum-core = { path = "../leviculum-core" }
# The start-announce pair's two delays, stated once for both stacks: the
# board's propagation role runs the same pair off the same constants.
leviculum-announce-policy = { path = "../leviculum-nrf/announce-policy" }
clap = { version = "4", features = ["derive"] }
tokio.workspace = true
tracing.workspace = true
rand_core = { version = "0.6", features = ["std", "getrandom"] }
# `block_on` for stamp validation inside the hook; see engine.rs for the
# budget note.
futures = "0.3"
# `alloc-mimalloc` only, which is a default feature; see it. The same line
# as lnsd's, so the workspace links one mimalloc.
mimalloc = { version = "0.1", optional = true, default-features = false }

[dev-dependencies]
tempfile = "3"
hex = "0.4"
# The provenance test asserts the PN_ACCEPT line itself, because the line is
# what the hardware cells wait for; capturing it needs a subscriber.
tracing-subscriber.workspace = true

[lib]
name = "lnpnd"
path = "src/lib.rs"

[[bin]]
name = "lnpnd"
path = "src/main.rs"
