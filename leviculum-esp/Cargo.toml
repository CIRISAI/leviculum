[package]
name = "leviculum-esp"
version = "0.1.6"
edition = "2021"
authors = ["Lew Palm"]
license = "AGPL-3.0-or-later"
description = "Reticulum firmware for ESP32-class boards (Heltec WiFi LoRa 32 V4, ThinkNode M9)"

# leviculum-esp is excluded from the root workspace and is its own
# workspace root, exactly as `leviculum-nrf` is. Two reasons, and the
# second is the one that matters:
#
#  * it cross-compiles (xtensa-esp32s3-none-elf) and carries its own
#    `.cargo/config.toml` for the target and the linker script;
#  * the Xtensa target does not exist in stock rustc at all. It needs the
#    esp-rs compiler fork, pinned here by `rust-toolchain.toml`. A member
#    of the host workspace would make `cargo test --workspace` on any
#    machine require that fork.
#
# The host workspace therefore lists this directory under `exclude` and
# neither `cargo metadata` nor `cargo test --workspace` sees it.
[workspace]
members = []

[dependencies]
# The protocol core, and with it the SX1262 command/register sequences
# this crate implements a bus for. `default-features = false` drops
# `tracing`: the firmware has no subscriber, and the callsite registry
# costs image for nothing.
leviculum-core = { path = "../leviculum-core", default-features = false }
# The byte-exact debug-log line shape, including the trailing ` t=<ms>`
# uptime stamp. Reached across into the nRF tree on purpose: the shape is
# what every host-side consumer greps (`lnflash::verify` splits on
# `[FW_BUILD]`, periculum's `fw_build_version_in` finds it), it is pinned
# there by host tests, and a second copy in this crate would be a second
# thing to keep in step. The crate is `no_std` with no dependencies of
# its own and nothing in it is nRF-specific.
leviculum-log-line = { path = "../leviculum-nrf/log-line" }

# ESP32-S3 HAL. `unstable` is required for the USB Serial/JTAG driver and
# for `Config::with_cpu_clock`; esp-hal gates everything that is not yet
# 1.0-stable behind it.
esp-hal = { version = "1.2.1", features = ["esp32s3", "unstable"] }
# Emits the `esp_app_desc` structure the second-stage bootloader reads.
# Without it `espflash save-image` produces an image the ROM refuses.
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"] }

# The flash behind the partition table and the stores in it (1414,
# `src/flash.rs`): the node's identity and the Loquax client record. The
# version esp-bootloader-esp-idf already pulls for the same chip.
esp-storage = { version = "0.10.0", features = ["esp32s3"] }
# The single-UART rules the M9's one port runs under since its frames carry
# the node (1414): the flow-byte escape for every frame, and the
# serial interface's HW_MTU. `no_std`, no dependencies but the core.
leviculum-serial-mux = { path = "../leviculum-nrf/serial-mux" }
# The lock the UART's receive interrupt and the loop share its keep under
# (1440); esp-hal provides the implementation. The version esp-hal uses.
critical-section = "1.2"
# Raw register access for the parked spin (1613, `src/corepark.rs`): the
# UART FIFOs it polls while the cache is off and the park interrupt's
# latch. esp-hal's own register_block() stays crate-private, and the spin
# must not call into driver code anyway. The version esp-hal pins.
esp32s3 = "0.36.0"
# The per-core heap pools' lock (1594, `src/pools.rs`): interrupts off on
# this core without the cross-core critical section. The version esp-hal
# uses.
esp-sync = { version = "0.3.0", features = ["esp32s3"] }
# `CryptoRngCore`, named in the node's type; esp-hal's `Trng` implements it
# through `unstable`. The version the core resolves to.
rand_core = { version = "0.6", default-features = false }

# The SX1262 buses are async, because `leviculum_core::sx126x`'s traits
# are. `Spi<'_, Async>` implements `embedded_hal_async::spi::SpiBus`.
embedded-hal-async = "1"
# The allocator.
# `leviculum-core` is `no_std + alloc`, so linking it into a binary
# requires a `#[global_allocator]` whether or not anything allocates yet.
# esp-hal registers the `critical_section::Impl` the heap needs.
# `tlsf` (rlsf), not `llff` (1569): llff is one free list, walked on
# every alloc and every free under the one cross-core critical section,
# and the walk grows with the heap's churn — the M9's full pull starved
# its UI core in exactly that walk (leviculum-heap-lab/tests/pull.rs
# measures the same fold under both: llff grows 14x from 400 to 4000
# entries, tlsf stays flat). Tlsf allocates and frees in constant time.
# rlsf directly, not embedded-alloc's TlsfHeap wrapper (1574): that one
# keeps rlsf's 4228 B control block in its static, in `.bss`, which on the
# ESP32-S3 comes off core 0's stack; `src/pool_tlsf.rs` places it inside
# the heap region instead. `unstable` for `Tlsf::iter_blocks` (heap_free),
# as embedded-alloc enabled it.
rlsf = { version = "0.2.3", default-features = false, features = ["unstable"] }

# The ThinkNode M9's Loquax image (order 1361): the renderer, the fixture
# model, the keyboard decoder, the frame dump and the census, all `no_std`
# and the same code the host pins its goldens with (`loquax-m9/tests/`).
# The loquax core comes through it, without `std`.
loquax-m9 = { path = "../loquax-m9" }
loquax = { path = "../loquax", default-features = false }
# The key events the pairing screen reads (1415), the type the keyboard
# driver hands out.
leviculum-ui = { path = "../leviculum-ui", default-features = false }
# The AG3352's boot init (1477): the T1000-E's `$PAIR` sequence behind
# the M9's sleep lock, pure and host-tested beside the nRF firmware.
leviculum-gnss-init = { path = "../leviculum-nrf/gnss-init" }
# The LR1110's board facts (1478): the M9's `Board` value, its RF switch
# and its PA table, in the driver's own types, so the build checks them
# against the driver the T1000-E runs and the next step drives the radio
# with.
leviculum-lr11xx = { path = "../leviculum-lr11xx" }
# The map regions' area in flash (1477): the directory the board reads
# and `lnflash --region` writes, one parser both sides.
leviculum-map = { path = "../leviculum-map" }

# esp-bootloader-esp-idf is used only through `esp_app_desc!()`, which
# expands to a static in a named link section; cargo-machete cannot see
# a macro-only dependency.
[package.metadata.cargo-machete]
ignored = ["esp-bootloader-esp-idf"]

[profile.release]
opt-level = "z"      # optimize for size
lto = true           # link-time optimization across all crates
codegen-units = 1    # single codegen unit for maximum LTO
strip = "none"       # keep DWARF in the .elf for addr2line on a crash PC.
                     # Does not bloat the flash image: `espflash save-image`
                     # packages loadable sections only.
debug = true         # emit the DWARF in the first place

# Firmware binaries. One per pinout family, named after the board the
# family is first proven on (docs/src/concepts/board-support-scope.md).
[[bin]]
name = "heltec_v4"
path = "src/bin/heltec_v4.rs"

# The ThinkNode M9 as a Loquax handheld (order 1361): the renderer on the
# panel, the keyboard, and since 1414 a Reticulum node on its serial port
# and a client of its home; no radio yet. `just build-m9` builds it with
# `partitions-m9.csv`.
[[bin]]
name = "thinknode_m9"
path = "src/bin/thinknode_m9.rs"
