[package]
name = "leviculum-channel-access"
version = "0.1.0"
edition = "2021"
authors = ["Lew Palm"]
license = "AGPL-3.0-or-later"
description = "Pure LoRa channel-access policy for the firmware's transmit path: acquisition jitter and the CAD retry gate, host-testable"

[dependencies]
# For the arithmetic this crate's policy is counted in, and for nothing else:
# the CSMA slot (`csma_slot_ms`), plus, in the tests, the airtime side of the
# post-TX window. The window's rows are DERIVED from the same formula the
# firmware charges its transmissions with (`airtime_ms_with_preamble`,
# `derive_preamble_symbols`) and from `PACING_MARGIN_MS` itself, never
# numbers copied in here where they would drift away from the radio. The
# policy — what a wait is spent on, and how long in slots — stays here.
leviculum-core = { path = "../../leviculum-core", default-features = false }
