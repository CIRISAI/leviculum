[package]
name = "leviculum-pn-store"
version = "0.1.0"
edition = "2021"
authors = ["Lew Palm"]
license = "AGPL-3.0-or-later"
description = "Propagation-node store adapters over the record log (host-testable)"

[dependencies]
# The identity a `/get` client proved, for the auth list (audit 2026-10-12 D18).
leviculum-core = { path = "../../leviculum-core", default-features = false }
leviculum-record-log = { path = "../record-log" }
leviculum-lxmf = { path = "../../leviculum-lxmf", default-features = false }
# The board's announced limits, which `board_role_config` hands the role.
leviculum-heap-budget = { path = "../heap-budget" }

[dev-dependencies]
leviculum-record-log = { path = "../record-log", features = ["sim"] }
# The streaming workblock, so the tests price a stamp the way the board does.
leviculum-lxmf = { path = "../../leviculum-lxmf", default-features = false, features = ["pow"] }
# The depth rule the inbound-sync peering takes from the link (683), so the
# D5 scenario test judges a reset board's neighbour as the engine does.
leviculum-sync-batch = { path = "../sync-batch" }
