[package]
name = "leviculum-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
# This string is the .deb's `Description:` line: cargo-deb has no
# description field of its own (3.7.0 rejects `description` under
# [package.metadata.deb] as an unknown key), so every binary named here is a
# promise to whoever installs the package. `lntd` is built by this crate but
# deliberately not packaged yet — it still owes a manual page, and the .deb
# requires one per shipped binary (Debian Policy 12.1) — so it is not named
# here either. It returns to this line in the same change that adds it to
# `[package.metadata.deb] assets`; scripts/verify-deb-packaging.sh holds the
# two together.
description = "Reticulum network stack daemon (lnsd), test tool (lnstest), file-transfer client (lncp), status tool (lnstatus), probe tool (lnprobe), and path tool (lnpath)"

[[bin]]
name = "lnsd"
path = "src/lnsd.rs"

[[bin]]
name = "lnstest"
path = "src/lnstest.rs"

[[bin]]
name = "lncp"
path = "src/lncp.rs"

[[bin]]
name = "lnstatus"
path = "src/lnstatus.rs"

[[bin]]
name = "lnprobe"
path = "src/lnprobe.rs"

[[bin]]
name = "lnpath"
path = "src/lnpath.rs"

[[bin]]
name = "lntd"
path = "src/lntd.rs"

[[bin]]
name = "auto-crossmachine-test"
path = "src/bin/auto_crossmachine_test.rs"

# Off by default, and it has to stay that way: a node built without it is
# byte-identical to one built before the feature existed (verified by
# sha256 on the musl-static `lnsd`, 2026-09-21). With it, `lnsd` installs
# `leviculum_std::heap_accounting::CountingAllocator` in front of the system
# allocator and the SIGUSR1 dump gains a MEASURED live-bytes line beside the
# modelled one — which is what a field node needs, because the modelled
# figure over-reported live data by 1.92x at the heap bench's table shape and
# a resident-to-data ratio computed from it is a ratio of a model.
#
#   cargo build --release -p leviculum-cli --bin lnsd --features heap-accounting
[features]
default = []
# Forwarded so the census gap line in leviculum-std subtracts the measured
# live bytes; the global allocator itself is installed in src/lnsd.rs.
heap-accounting = ["leviculum-std/heap-accounting"]
# Off by default (508). `lnsd` runs on mimalloc instead of the libc
# allocator: the soak node's resident set was 517 MB over 104 MB live after
# 3.5 h, the rest kept by musl's mallocng under ~26 000 allocations a second,
# and this is the build that measures whether another allocator keeps less.
# With `heap-accounting` as well, the counting shim wraps mimalloc
# (`heap_accounting::CountingOver`), so the census still reports live bytes.
alloc-mimalloc = ["dep:mimalloc"]

[dependencies]
leviculum-core = { path = "../leviculum-core", default-features = true }
leviculum-std = { path = "../leviculum-std" }
# `lntd` only: the LXMF delivery destination it collects on, and the
# Telemeter decoder it writes rows from.
leviculum-lxmf = { path = "../leviculum-lxmf" }
tokio.workspace = true
tracing = { workspace = true, features = ["std"] }
tracing-subscriber.workspace = true
clap = { version = "4", features = ["derive"] }
rand_core.workspace = true
rmpv.workspace = true
sha2.workspace = true
serde_json = "1"
# `alloc-mimalloc` only; see the feature.
mimalloc = { version = "0.1", optional = true, default-features = false }
# `lnstest diag` re-serialises the (secret-redacted) Config to TOML for the bundle.
toml.workspace = true
tempfile = "3"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }

# `cargo deb -p leviculum-cli --target x86_64-unknown-linux-musl`
# builds a .deb whose binaries are statically linked and therefore
# run on any Debian ≥ 9 / Ubuntu ≥ 16.04 regardless of host glibc.
# See packaging/debian/ for the systemd unit, default config, and
# maintainer scripts.
[package.metadata.deb]
name = "leviculum"
maintainer = "Lew Palm <lp@lew-palm.de>"
copyright = "2025, Lew Palm"
license-file = ["../LICENSE", "0"]
extended-description = """\
Leviculum is a Rust implementation of the Reticulum network stack,
wire-compatible with the Python reference implementation.

This package installs six binaries:
  lnsd     — the Reticulum daemon (drop-in replacement for Python rnsd)
  lnstest  — the test and diagnostics tool (selftest, diag, identity, connect)
  lncp     — the file-transfer tool (drop-in for rncp)
  lnstatus — the network status tool (drop-in for rnstatus)
  lnprobe  — the reachability probe tool (drop-in for rnprobe)
  lnpath   — the path query and drop tool (drop-in for rnpath)

lnsd is configured as a systemd service running under a dedicated
'leviculum' user, with its config directory at /etc/reticulum. Python
Reticulum clients (rnstatus, rncp, Sideband, Nomadnet) detect this
directory automatically via their standard /etc/reticulum lookup
and connect to the shared-instance socket without extra flags.
"""
section = "net"
priority = "optional"
# The binaries are musl-static, so they have no NEEDED shared-library
# deps for cargo-deb's `$auto` to discover. Declaring `$auto` here
# would just emit a warning per binary on every build. adduser is the
# only real runtime dependency (postinst calls it to create the
# leviculum system user).
depends = "adduser"
# The heap-accounting variants below are the same six binaries under other
# package names, so no two of the three may be installed side by side: each
# conflicts with and replaces the others, and `dpkg -i` of any one removes
# whichever is there (Codeberg #437, and 508 for the mimalloc one).
conflicts = "leviculum-heapacct, leviculum-heapacct-mimalloc"
replaces = "leviculum-heapacct, leviculum-heapacct-mimalloc"
assets = [
    # cargo-deb only recognises "target/release/..." exactly as a Cargo
    # target path and auto-substitutes the --target triple into it.
    # Any prefix (e.g. "../") disables the rewrite and makes cargo-deb
    # read the literal path, which silently picks up stale non-musl
    # builds. Always use this form.
    ["target/release/lnsd", "usr/bin/", "755"],
    ["target/release/lnstest", "usr/bin/", "755"],
    ["target/release/lncp", "usr/bin/", "755"],
    ["target/release/lnstatus", "usr/bin/", "755"],
    ["target/release/lnprobe", "usr/bin/", "755"],
    ["target/release/lnpath", "usr/bin/", "755"],
    # Source must NOT be named `config`, even though the destination is:
    # `maintainer-scripts` below points at the same directory, and
    # cargo-deb picks up a file named `config` there as the debconf
    # pre-configuration script, shipping this TOML-ish file a second time
    # as an executable control script.
    ["../packaging/debian/reticulum-config", "etc/reticulum/config", "644"],
    ["../README.md", "usr/share/doc/leviculum/README.md", "644"],
    ["../CHANGELOG.md", "usr/share/doc/leviculum/CHANGELOG.md", "644"],
    # Rendered from docs/src/man/ by scripts/md2man.py; see lblogd's
    # manifest for why the Markdown under docs/ is the single source.
    ["../target/man/lnsd.1", "usr/share/man/man1/lnsd.1", "644"],
    ["../target/man/lnstest.1", "usr/share/man/man1/lnstest.1", "644"],
    ["../target/man/lncp.1", "usr/share/man/man1/lncp.1", "644"],
    ["../target/man/lnstatus.1", "usr/share/man/man1/lnstatus.1", "644"],
    ["../target/man/lnprobe.1", "usr/share/man/man1/lnprobe.1", "644"],
    ["../target/man/lnpath.1", "usr/share/man/man1/lnpath.1", "644"],
    # Documented overrides for the two lintian tags that a
    # musl-static binary always trips; the file explains why each
    # is a deliberate deviation rather than a defect.
    ["../packaging/lintian/leviculum", "usr/share/lintian/overrides/leviculum", "644"],
    # Codeberg #288. The binaries above are musl-static, so every MIT- and
    # BSD-licensed crate is inside them rather than beside them, and both
    # families require their copyright line and permission text to accompany
    # a binary distribution. license-file above ships our AGPL and says
    # nothing about them. Generated from Cargo.lock by scripts/gen-notices.py
    # and kept honest by `just notices-guard` in Tier 0.
    ["../THIRD-PARTY-NOTICES", "usr/share/doc/leviculum/THIRD-PARTY-NOTICES", "644"],
]
# Note: this is the *Debian* changelog, generated per build by
# scripts/deb-stamp.sh. The project's own CHANGELOG.md ships separately
# under usr/share/doc, above.
changelog = "../target/deb-changelog/leviculum"
maintainer-scripts = "../packaging/debian/"
conf-files = ["/etc/reticulum/config"]

[package.metadata.deb.systemd-units]
unit-name = "lnsd"
unit-scripts = "../packaging/debian/"
enable = true
start = true
restart-after-upgrade = true

# Codeberg #437: the instrumented build for memory censuses on a field node,
# not for daily use. Same binaries, same unit, same config; only `lnsd` is
# rebuilt with `--features heap-accounting` (scripts/build-deb.sh), so its
# SIGUSR1 census subtracts measured live bytes instead of the model. A
# variant inherits everything above, so only the package relations and the
# description differ. Built with `cargo deb --variant heapacct`; the version gets a `+heapacct` suffix from
# the build script, so either direction of a swap is visible in `dpkg -l`.
[package.metadata.deb.variants.heapacct]
# Named explicitly: cargo-deb 3.7 keeps the base name for a variant, and a
# second "leviculum" package in target/debian/ makes it delete the plain one
# it finds there (measured 2026-10-06, the first local build lost it).
name = "leviculum-heapacct"
conflicts = "leviculum, leviculum-heapacct-mimalloc"
replaces = "leviculum, leviculum-heapacct-mimalloc"
provides = "leviculum"
extended-description = """\
Leviculum is a Rust implementation of the Reticulum network stack,
wire-compatible with the Python reference implementation.

This is the heap-accounting build of the leviculum package: the same six
binaries, but lnsd counts every allocation, so its SIGUSR1 memory census
reports measured live heap bytes beside the modelled total. It costs a few
atomic operations per allocation and exists for memory investigations on a
field node, not for daily use. It conflicts with and replaces the plain
leviculum package and leviculum-heapacct-mimalloc; installing any one of
them swaps the other out.
"""

# 508: the same instrumented build on mimalloc instead of the libc allocator
# (`--features heap-accounting,alloc-mimalloc`), so the soak node can run one
# census against the other and tell whether the allocator is what keeps the
# freed memory. The version gets a `+heapacct+mimalloc` suffix, and `lnsd
# --version` says the same.
[package.metadata.deb.variants.heapacct-mimalloc]
name = "leviculum-heapacct-mimalloc"
conflicts = "leviculum, leviculum-heapacct"
replaces = "leviculum, leviculum-heapacct"
provides = "leviculum"
extended-description = """\
Leviculum is a Rust implementation of the Reticulum network stack,
wire-compatible with the Python reference implementation.

This is the heap-accounting build of the leviculum package with lnsd on
the mimalloc allocator instead of the libc one: the same six binaries,
but lnsd counts every allocation and its SIGUSR1 memory census reports
measured live heap bytes, so its numbers compare directly with the
leviculum-heapacct package's. It exists for memory investigations on a
field node, not for daily use. It conflicts with and replaces the plain
leviculum package and leviculum-heapacct; installing any one of them
swaps the other out.
"""
