# cargo-deny configuration.
#
# Leviculum is AGPL-3.0-or-later; its dependency tree is permissively licensed.
# cargo-deny 0.19 denies any license not explicitly allowed, so the set below
# is the union of licenses actually present in the graph (crypto is
# dalek/RustCrypto; no `ring`/OpenSSL, so no custom-license exceptions needed).

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0", # webpki-roots — Mozilla CA-cert bundle data (pulled by upstream TLS crates)
    "AGPL-3.0",
    "AGPL-3.0-or-later",
    "bzip2-1.0.6", # libbz2-rs-sys — the bzip2 license (RNS uses bzip2)
]
confidence-threshold = 0.8

# `unescaper` (pulled by serialport) declares `GPL-3.0/MIT` — the deprecated
# `/` OR-syntax, which is not valid SPDX so cargo-deny can't evaluate the OR.
# It is dual-licensed and we take it under MIT; clarify the expression so the
# already-allowed MIT applies.
[[licenses.clarify]]
crate = "unescaper"
expression = "MIT"
license-files = []

[advisories]
# Fail the build on RUSTSEC security advisories; warn on yanked crates.
yanked = "warn"
ignore = [
    # Unmaintained, not a vulnerability, and no successor release exists. It
    # reaches the graph only through upstream's iced GUI (fontdb, cosmic-text);
    # no fork crate parses fonts. Drop this when iced moves to skrifa.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; only via upstream iced GUI, no fix exists" },
    # Unmaintained, not a vulnerability, and no successor release exists. It is
    # a small transitive dependency; drop this when its dependents move off it.
    { id = "RUSTSEC-2026-0441", reason = "pin-utils unmaintained; transitive only, no fix exists" },
    # Unmaintained, not a vulnerability, and no successor release exists. It
    # reaches the graph only through rustls-acme in lblogd (upstream's log
    # daemon); no node or core crate uses it. Drop it when rustls-acme moves.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; only via rustls-acme in lblogd, no fix exists" },
    # heapless 0.8.0 (leviculum-core, and embassy-sync 0.7.2 via ble-tx, pin
    # ^0.8): these are fixed only in 0.9.4, no 0.8.x carries them. Each entry
    # says why our use is not affected; moving off 0.8 is tracked in
    # https://github.com/CIRISAI/leviculum/issues/115.
    { id = "RUSTSEC-2026-0574", reason = "SortedLinkedList FindMutView::pop: not called (leviculum#115)" },
    { id = "RUSTSEC-2026-0575", reason = "spsc::Spsc::peek: not used (leviculum#115)" },
    { id = "RUSTSEC-2026-0576", reason = "IndexMap::truncate: not called (leviculum#115)" },
    { id = "RUSTSEC-2026-0577", reason = "IndexMap clear/retain unwinding: our keys/values cannot panic in Drop, retain closures cannot panic (leviculum#115)" },
    { id = "RUSTSEC-2026-0578", reason = "SortedLinkedList::zeroize: not called (leviculum#115)" },
    { id = "RUSTSEC-2026-0579", reason = "Deque::try_from: affects 0.9.2-0.9.3 only, we are on 0.8.0 (leviculum#115)" },
    { id = "RUSTSEC-2026-0580", reason = "arc/object/box pools: not used (leviculum#115)" },
    { id = "RUSTSEC-2026-0581", reason = "Deque::make_contiguous: not called; embassy-sync channels unused (leviculum#115)" },
    { id = "RUSTSEC-2026-0582", reason = "IndexMap::insert at u16::MAX elements: every map holds 256 or fewer (leviculum#115)" },
]

[bans]
# Transitive ecosystem version splits (bitflags 1/2, rand 0.8/0.9, …) are
# unavoidable and harmless; don't fail on them.
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
