# The public rooms' hubs Loquax offers (1577, 1599, #232), compiled in
# (`loquax::ui::hubs`). A hub ships when it answered: an announce or a
# path, a link, and a WELCOME to a HELLO, published or not (Lew,
# 2026-11-09); `source` says where it was found, a publication or "heard
# on the mesh <date>". Nothing ships unmeasured. Measured with
# `loquax/examples/rrc_hubs_probe.rs` over the shipped entry servers
# (leviculum.network:4242 and the Sauerland testnet, 38.242.217.238:4242).
# `just rrc-hubs-check` measures again and diffs against this file, so a
# stale hash is a finding, not a surprise. No hub is connected to on its
# own: this is the list the settings offer.
#
# Keys of a [[hub]]: name (what the settings show; never the protocol's
# name), hash (its `rrc.hub` destination), rooms (what the hub's own
# welcome named), published_rooms (what the source names), source (where
# the hash was published, or the day it was heard on the mesh), measured
# (the day it answered), hops (at its first hearing, or by its path when it
# was never heard; the file is in this order, closest first). A name is
# empty when neither the announce nor the WELCOME gave one but "hub": the
# settings call it "Unnamed hub" with its hops.
#
# This list only seeds a fresh install: Loquax discovers hubs from their
# announces (1599), and the list is what it offers before it heard any.
# An [[unreached]] entry was published and did not answer on the day
# named; it is not offered, and the check tries it again.

