# The public rooms' hubs Loquax offers (1577, #232), compiled in
# (`loquax::ui::hubs`). A hub ships only when it answered: an announce or a
# path, a link, and a WELCOME to a HELLO, measured with
# `loquax/examples/rrc_hubs_probe.rs` over the shipped entry servers
# (leviculum.network:4242 and the Sauerland testnet, 38.242.217.238:4242).
# `just rrc-hubs-check` measures again and diffs against this file, so a
# stale hash is a finding, not a surprise. No hub is connected to on its
# own: this is the list the settings offer.
#
# Keys of a [[hub]]: name (what the settings show; never the protocol's
# name), hash (its `rrc.hub` destination), rooms (what the hub's own
# welcome named), published_rooms (what the source names), source (where
# the hash was published), measured (the day it answered).
# An [[unreached]] entry was published and did not answer on the day
# named; it is not offered, and the check tries it again.

