[workspace]
resolver = "2"
members = [
    "leviculum-core",
    "leviculum-micron",
    "leviculum-mapfill",
    "leviculum-map",
    "leviculum-mapcut",
    "leviculum-map-tool",
    "leviculum-ui",
    "leviculum-ui-ratatui",
    "lnomad",
    "lblogd",
    "leviculum-lxmf",
    "leviculum-lxmf-node",
    "leviculum-std",
    "leviculum-ffi",
    "leviculum-cli",
    "leviculum-proxy",
    "lnflash",
    "loquax",
    # The Android app's JNI library (`loquax-android/`), built for Android by
    # the make flow there. Not a default member, like leviculum-ffi: a cdylib
    # the musl default drops.
    "loquax-android",
    "lnpnd",
    "lndecode",
    "vectors-verify",
    # Vendored nmea0183 with the float parse replaced (Codeberg #386). A
    # member, unlike vendor/crossterm, because the patch is ours: its unit
    # tests assert the fixed-point parse is bit-identical to `str::parse`,
    # and `cargo test --workspace` is what runs them. Not a default member —
    # no host binary links it, only the nRF firmware does, through the
    # `[patch.crates-io]` in leviculum-nrf/Cargo.toml.
    "vendor/nmea0183",
]

# leviculum-ffi is a gnu-target cdylib (built via the `build-ffi` alias). It is
# excluded from the default musl build (default target per .cargo/config.toml)
# because cdylib is unsupported on musl, which otherwise emits
# `warning: dropping unsupported crate type cdylib` on a bare build. It stays a
# member so `-p leviculum-ffi`, `--workspace`, and `build-ffi` still work.
default-members = [
    "leviculum-core",
    "leviculum-micron",
    "leviculum-mapfill",
    "leviculum-map",
    "leviculum-mapcut",
    "leviculum-map-tool",
    "leviculum-ui",
    "leviculum-ui-ratatui",
    "lnomad",
    "lblogd",
    "leviculum-lxmf-node",
    "leviculum-std",
    "leviculum-cli",
    "leviculum-proxy",
    "lnflash",
    "loquax",
    "lnpnd",
    "lndecode",
    "vectors-verify",
]

# leviculum-nrf requires cross-compilation (thumbv7em-none-eabihf) and
# cannot build with --workspace on the host.
# Build with: cargo build -p leviculum-nrf --target thumbv7em-none-eabihf
#
# leviculum-esp is excluded for a harder reason than cross-compilation: its
# target (xtensa-esp32s3-none-elf) does not exist in stock rustc at all, only
# in the esp-rs compiler fork espup installs. As a member it would make
# `cargo test --workspace` on any machine require that fork. It carries its
# own workspace, Cargo.lock, .cargo/config.toml and rust-toolchain.toml.
# Build with: just build-esp32  (or `cargo build --release` inside it)
#
# leviculum-mapfill/measure and leviculum-mapfill/m9 are the map measurement's
# host harness and M9 firmware (#474). Their own workspaces keep the harness's
# protobuf decoder and the firmware's Xtensa toolchain out of this graph.
exclude = ["leviculum-nrf", "leviculum-esp", "leviculum-lr11xx", "leviculum-mapfill/measure", "leviculum-mapfill/m9", "vendor/crossterm", "vendor/termbg"]

# Vendored, minimally-patched crossterm 0.29.0. The patch exposes mouse side
# buttons (X buttons 8/9) as MouseButton::Back / MouseButton::Forward, which
# upstream crossterm swallows in parse_cb. lnomad, ratatui-crossterm and termbg
# all resolve to crossterm 0.29.0, so this replaces it everywhere.
#
# termbg is vendored for that reason alone: 0.6.2, the newest release, asks
# for crossterm 0.28 and so linked a second, unpatched registry crossterm
# into lnomad, with its own stdin event reader for the OSC 11 background query.
# vendor/termbg is the published 0.6.2 with one line changed, its crossterm
# requirement raised to 0.29 (the API it uses did not change). Drop the patch
# once a termbg release asks for 0.29 itself.
[patch.crates-io]
crossterm = { path = "vendor/crossterm" }
termbg = { path = "vendor/termbg" }

[workspace.package]
version = "0.34.0+ciris.3"
edition = "2021"
authors = ["Lew Palm"]
license = "AGPL-3.0-or-later"
repository = "https://codeberg.org/Lew_Palm/leviculum"
homepage = "https://codeberg.org/Lew_Palm/leviculum"
description = "Rust implementation of the Reticulum network stack"

[workspace.dependencies]
# Core crypto dependencies (no_std compatible)
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "zeroize"] }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "zeroize"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
aes = { version = "0.8", default-features = false }
cbc = { version = "0.1", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
md-5 = { version = "0.10" }
hkdf = { version = "0.12", default-features = false }
rand_core = { version = "0.6", default-features = false }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
# MessagePack wire primitives for the no_std + alloc LXMF codec.
rmp = { version = "0.8.15", default-features = false }

# std dependencies
tokio = { version = "1", features = ["full"] }
tokio-serial = "5"
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
rmpv = "1"
serde-pickle = "1"
toml = "0.8"
thiserror = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
bytes = "1"

# Compression (no_std compatible)
libbz2-rs-sys = { version = "0.2", default-features = false, features = ["rust-allocator"] }

# Networking
if-addrs = { version = "0.15", features = ["link-local"] }
socket2 = { version = "0.6", features = ["all"] }

# BLE (Columba mesh interface in leviculum-std). bluer is the official BlueZ
# Rust binding; it speaks D-Bus through the libdbus-based `dbus` crate, whose
# `vendored` feature compiles libdbus from source so the musl-static default
# target keeps producing self-contained binaries (the same reason rustls-acme
# rides on ring above).
bluer = { version = "0.17", default-features = false, features = ["bluetoothd"] }
dbus = { version = "0.9", features = ["vendored"] }

# Web server (lblogd clearnet side). rustls-acme runs on ring instead of its
# aws-lc-rs default: ring cross-builds cleanly for the musl-static default
# target without a cmake toolchain.
axum = "0.8"
axum-server = "0.8"
rustls-acme = { version = "0.15", default-features = false, features = ["ring", "tls12", "webpki-roots", "axum"] }
futures = "0.3"
tower = { version = "0.5", features = ["util"] }
# Filesystem watching for lblogd's optional posts auto-reload. Version 8 is
# the stable line; 9 is still a release candidate.
notify = "8"

# FFI
libc = "0.2"

# Testing
proptest = "1"

# Debug and test builds carry line tables only, not the full DWARF (#381).
# Every test binary statically links the same stack and repeated the same
# debuginfo, three quarters of each binary (sizes in MiB, 2026-10-16):
#
#   binary              full DWARF  no debuginfo  stripped  line tables
#   deps/mvr-*          257         61            36        110
#   deps/lxmf_node-*    230         55            33         94
#   debug/lnsd          221         52            31         91
#
# All test executables of the workspace together: 26.0 GiB before, 9.5
# GiB with line tables; those above 50 MB went from 128 to 102.
#
# What a red test needs is the panic backtrace with file:line, and that
# lives in .debug_line, which this level keeps. For a debugger session,
# build with `--config profile.dev.debug=2`. [profile.test] inherits this.
[profile.dev]
debug = "line-tables-only"

# Crypto libs are unusably slow without optimizations (constant-time field
# arithmetic, scalar multiplication). Build them at max opt even in debug.
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.x25519-dalek]
opt-level = 3

# Strip debug info (not symbols) at link time. Rustc passes the right
# flags per target, which avoids the post-link `strip --strip-all` that
# cargo-deb runs by default — that one corrupted x86_64 musl-static
# binaries (segfault at startup, see commit history). "debuginfo" keeps
# the symbol table, so panic backtraces still show function names.
# .deb builds pair this with `cargo deb --no-strip` in
# .woodpecker/nightly.yml so cargo-deb's strip is skipped entirely.
[profile.release]
strip = "debuginfo"
# Pin unwinding (already the default). The leviculum-ffi cdylib relies on
# catch_unwind at every extern "C" boundary so a Rust panic becomes an error
# code instead of unwinding into C (undefined behaviour). panic = "abort"
# would make catch_unwind a no-op and turn any internal panic into a process
# abort of the host application embedding libleviculum, which a library must
# never do. This forecloses an abort-for-size option on the daemons; that is
# the intended tradeoff. Behaviour-preserving since unwind is already default.
panic = "unwind"
