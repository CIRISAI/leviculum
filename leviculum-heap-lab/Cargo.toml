[package]
name = "leviculum-heap-lab"
# Versioned on its own: a host lab for the boards' allocator choices,
# linked by nothing.
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The embedded heaps on the host: run the M9's real workload under the allocator the firmware links (order 1569)"
# A measurement harness, not a library anything ships.
publish = false

[dependencies]
# The two allocators the firmware has linked (leviculum-esp/src/lib.rs):
# llff (embedded-alloc's, linked_list_allocator inside) before 1569, rlsf
# since. The lab links the data structures without the firmware's
# critical-section lock, which is not what is under measurement and has
# no host implementation in this tree.
linked_list_allocator = { version = "0.10", default-features = false }
# The tlsf side is the firmware's own wrapper (leviculum-esp/src/
# pool_tlsf.rs, included by path, 1574): the control block inside the
# region. `unstable` for `Tlsf::iter_blocks`, which its `free` walks.
rlsf = { version = "0.2.3", default-features = false, features = ["unstable"] }

[dev-dependencies]
# The M9's real pull workload (tests/pull.rs): the board's model, its
# fold, and the archive shape of loquax-m9/tests/turn.rs.
loquax-m9 = { path = "../loquax-m9" }
loquax = { path = "../loquax", default-features = false }
leviculum-core = { path = "../leviculum-core", default-features = false }
leviculum-lxmf = { path = "../leviculum-lxmf", default-features = false }
rand_core = { workspace = true, features = ["getrandom"] }
