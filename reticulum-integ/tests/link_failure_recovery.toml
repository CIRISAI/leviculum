[test]
name = "link_failure_recovery"
description = "Block direct link, probe reroutes via relay, restore link, probe returns to 1 hop"
timeout_secs = 180

[nodes.alice]
type = "rust"
enable_transport = true
respond_to_probes = true

[nodes.relay]
type = "python"
enable_transport = true
respond_to_probes = false

[nodes.bob]
type = "rust"
enable_transport = true
respond_to_probes = true

[links]
alice-bob = "tcp"
alice-relay = "tcp"
bob-relay = "tcp"

# 1. Establish direct path. expect_hops: the first announce to arrive
# may install the 2-hop relay path; poll until the direct 1-hop
# announce has overridden it.
[[steps]]
action = "wait_for_path"
on = "alice"
destination = "bob.probe"
timeout_secs = 30
expect_hops = 1

# 2. Verify direct 1-hop path works
[[steps]]
action = "rnprobe"
from = "alice"
to = "bob.probe"
expect_hops = 1
expect_result = "success"

# 3a. Block direct link alice -> bob
[[steps]]
action = "block_link"
from = "alice"
to = "bob"

# 3b. Block direct link bob -> alice (bidirectional)
[[steps]]
action = "block_link"
from = "bob"
to = "alice"

# 4. Wait for path expiry / re-discovery via relay: poll until the
# 2-hop relay route is installed. Link death is detected via TCP
# keepalive (tens of seconds), so the timeout is generous.
[[steps]]
action = "wait_for_path"
on = "alice"
destination = "bob.probe"
timeout_secs = 60
expect_hops = 2

# 5. Probe should now route via relay (2 hops)
[[steps]]
action = "rnprobe"
from = "alice"
to = "bob.probe"
expect_hops = 2
expect_result = "success"
timeout_secs = 30

# 6a. Restore direct link alice -> bob
[[steps]]
action = "restore_link"
from = "alice"
to = "bob"

# 6b. Restore direct link bob -> alice (bidirectional)
[[steps]]
action = "restore_link"
from = "bob"
to = "alice"

# 7. Wait for re-announce / path healing: poll until the restored
# direct 1-hop announce has overridden the 2-hop relay route.
[[steps]]
action = "wait_for_path"
on = "alice"
destination = "bob.probe"
timeout_secs = 60
expect_hops = 1

# 8. Probe should return to 1-hop direct path
[[steps]]
action = "rnprobe"
from = "alice"
to = "bob.probe"
expect_hops = 1
expect_result = "success"
timeout_secs = 30
