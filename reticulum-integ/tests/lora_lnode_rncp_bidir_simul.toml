# Python-stack twin of lora_lnode_lncp_bidir_simul (Codeberg #131).
#
# Reference-first measurement scaffold: the SAME simultaneous bidirectional
# 2KB transfer over the SAME LNodes at the SAME radio config (SF10 /
# BW125000 / CR8 / CSMA on), but with the PYTHON stack driving both sides:
# rnsd is the daemon on each node (drop-in on the LNode serial radio, same
# generated config lnsd reads) and rncp is the transfer client, so the
# link + resource logic under contention is Python's, not ours.
#
# A/B against lora_lnode_lncp_bidir_simul answers whether the reverse-
# direction starvation seen there is our fairness bug (Python passes) or a
# fundamental half-duplex limit (Python fails too). Everything except the
# stack is held identical; only the timeouts carry extra margin for Python
# interpreter cold-start and rncp's slower pacing.
#
# Measured answer: Python fails too (rncp 0/2 runs vs our lncp 1/2) — the
# losing direction stalls at link establishment on the shared half-duplex
# channel. Hence the reframed success bar (Codeberg #131): BOTH directions
# must ultimately complete (md5-verified); serialized completion via retry
# on the freed channel counts, true-concurrent completion is best-effort
# only. A direction that never completes even after the serialized
# retries is a genuine wedge and fails the test.
#
# rnsd's SerialInterface never pushes radio parameters to the LNode
# firmware (it is a plain HDLC serial pipe); the integ runner detects the
# python + serial combination and pushes this [radio] config to the bound
# boards itself before the containers start (see
# preconfigure_python_lnode in runner.rs).

profile = "lnode_pair"

[test]
name = "lora_lnode_rncp_bidir_simul"
description = "Python rnsd+rncp simultaneous bidirectional 2KB between two LNodes over direct LoRa at SF10"
timeout_secs = 1080

[radio]
# Identical to lora_lnode_lncp_bidir_simul: slow spreading factor, CSMA/CA on.
frequency = 869525000
bandwidth = 125000
sf = 10
cr = 8
txpower = 17
csma_enabled = true

[nodes.alpha]
type = "python"
respond_to_probes = true
serial = true

[nodes.beta]
type = "python"
respond_to_probes = true
serial = true

# Warm up: wait for announces to propagate
[[steps]]
action = "sleep"
duration_secs = 25

[[steps]]
action = "wait_for_path"
on = "alpha"
destination = "beta.probe"
timeout_secs = 300

[[steps]]
action = "file_transfer"
sender = "alpha"
receiver = "beta"
sender_tool = "rncp"
receiver_tool = "rncp"
file_sizes = [2048]
direction = "simultaneous"
repeats = 1
timeout_secs = 600
